<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ОГЭ: орфография — итоговый тест</title>
<style>
:root{
  --bg:#0d1117;
  --bg2:#141b24;
  --panel:#1a232e;
  --panel2:#222d3a;
  --line:#2e3d4d;
  --gold:#f0a03c;
  --gold-dim:#8a5e22;
  --steel:#8fa3b8;
  --white:#e8eef5;
  --green:#87c442;
  --red:#d1453b;
  --blue:#4d90d4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0%, #1b2836 0%, var(--bg) 55%),
    var(--bg);
  color:var(--white);
  font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
  min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow-wrap:break-word;
  word-break:break-word;
}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 60px;}

/* ---------- HEADER ---------- */
.logo{
  text-align:center;
  padding:18px 6px 10px;
}
.logo h1{
  margin:0;
  font-size:clamp(20px,5.6vw,34px);
  letter-spacing:2px;
  font-weight:800;
  font-style:italic;
  color:var(--gold);
  text-shadow:0 0 18px rgba(240,160,60,.35);
}
.logo .sub{
  margin-top:6px;
  font-size:12px;
  letter-spacing:3px;
  color:var(--steel);
}
.crate{
  display:inline-block;
  margin-top:12px;
  padding:4px 14px;
  border:1px solid var(--gold-dim);
  background:rgba(240,160,60,.08);
  font-size:11px;
  letter-spacing:2px;
  color:var(--gold);
}

/* ---------- GLOBAL PROGRESS ---------- */
.gbar-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--gold);
  padding:12px 14px;
  margin:16px 0 20px;
}
.gbar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:1px;color:var(--steel);margin-bottom:8px;}
.gbar-top b{color:var(--gold);font-size:20px;letter-spacing:0;}
.bar{height:12px;background:#0a0f15;border:1px solid var(--line);position:relative;overflow:hidden;}
.bar>i{
  display:block;height:100%;width:0%;
  background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#d98e2f 6px 10px);
  transition:width .45s cubic-bezier(.2,.8,.2,1);
}
.gstats{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;font-size:11px;color:var(--steel);}
.gstats span{background:#0f161e;border:1px solid var(--line);padding:3px 8px;}
.gstats b{color:var(--white);}

/* ---------- MENU ---------- */
.part-h{
  margin:22px 0 10px;
  font-size:13px;
  letter-spacing:3px;
  color:var(--steel);
  border-bottom:1px solid var(--line);
  padding-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.part-h em{font-style:normal;color:var(--gold);font-size:12px;}
.item{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(90deg,var(--panel) 0%,var(--bg2) 100%);
  border:1px solid var(--line);
  padding:11px 12px;
  margin-bottom:8px;
  cursor:pointer;
  transition:border-color .15s,transform .1s;
}
.item:active{transform:scale(.99);}
.item:hover{border-color:var(--gold-dim);}
.item .num{
  flex:0 0 34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  background:#0e151d;
  color:var(--steel);
  font-weight:700;font-size:14px;
}
.item.done .num{border-color:var(--green);color:var(--green);}
.item .mid{flex:1;min-width:0;}
.item .nm{font-size:14.5px;font-weight:600;line-height:1.25;}
.item .meta{font-size:11px;color:var(--steel);margin-top:4px;letter-spacing:.5px;}
.item .lbar{height:5px;background:#0a0f15;border:1px solid var(--line);margin-top:6px;}
.item .lbar>i{display:block;height:100%;background:var(--gold);transition:width .4s;}
.item.done .lbar>i{background:var(--green);}
.item .pc{flex:0 0 46px;text-align:right;font-size:15px;font-weight:800;color:var(--gold);}
.item.done .pc{color:var(--green);}
.tag{
  display:inline-block;font-size:9.5px;letter-spacing:1px;
  padding:1px 5px;border:1px solid var(--gold-dim);color:var(--gold);
  margin-right:5px;vertical-align:1px;
}
.tag.t2{border-color:#3d6f9e;color:var(--blue);}
.tag.t3{border-color:#7a4a2a;color:#d98e2f;}

/* ---------- BUTTONS ---------- */
button{font-family:inherit;}
.btn{
  display:block;width:100%;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  color:var(--white);
  border:1px solid var(--line);
  padding:13px 14px;
  font-size:15px;
  text-align:left;
  cursor:pointer;
  margin-bottom:8px;
  line-height:1.35;
  transition:border-color .12s,background .12s;
}
.btn:hover:not(:disabled){border-color:var(--gold-dim);}
.btn:disabled{cursor:default;}
.btn.ok{border-color:var(--green);background:rgba(135,196,66,.14);color:#d6f0b0;}
.btn.bad{border-color:var(--red);background:rgba(209,69,59,.14);color:#f2bab6;}
.btn.sel{border-color:var(--gold);background:rgba(240,160,60,.12);}
.btn .k{
  display:inline-block;width:22px;color:var(--steel);font-size:12px;
}
.btn.ok .k,.btn.bad .k{color:inherit;}
.act{
  display:block;width:100%;
  background:linear-gradient(180deg,#f0a03c,#c87a20);
  color:#1a1206;border:none;
  padding:14px;font-size:15px;font-weight:800;letter-spacing:1.5px;
  cursor:pointer;margin-top:10px;
}
.act.ghost{background:transparent;border:1px solid var(--line);color:var(--steel);font-weight:600;letter-spacing:1px;}
.act:active{filter:brightness(.92);}

/* ---------- GAME HUD ---------- */
.hud{
  position:sticky;top:0;z-index:20;
  background:rgba(13,17,23,.96);
  border-bottom:1px solid var(--line);
  padding:8px 12px 10px;
  margin:0 -14px 14px;
  backdrop-filter:blur(6px);
}
.hud-r1{display:flex;align-items:center;gap:10px;}
.back{
  background:none;border:1px solid var(--line);color:var(--steel);
  padding:5px 9px;font-size:12px;cursor:pointer;flex:0 0 auto;
}
.hud-title{flex:1;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--white);}
.ammo{flex:0 0 auto;font-size:12px;color:var(--steel);letter-spacing:1px;}
.ammo b{color:var(--gold);font-size:15px;}
.hud-r2{display:flex;gap:10px;margin-top:8px;align-items:center;}
.hud-r2 .lab{font-size:10px;color:var(--steel);letter-spacing:1px;flex:0 0 auto;}
.hud-r2 .bar{flex:1;height:9px;}
.hud-r2 .val{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--gold);min-width:38px;text-align:right;}
.hud-r2.g .bar>i{background:repeating-linear-gradient(90deg,#4d90d4 0 6px,#3b74ad 6px 10px);}
.hud-r2.g .val{color:var(--blue);}

/* ---------- QUESTION ---------- */
.qcard{
  background:var(--panel);
  border:1px solid var(--line);
  border-top:3px solid var(--gold);
  padding:16px 14px;
  margin-bottom:14px;
}
.qtype{font-size:10px;letter-spacing:2px;color:var(--steel);margin-bottom:9px;}
.qtext{font-size:17px;line-height:1.5;font-weight:600;}
.qtext .gap{color:var(--gold);letter-spacing:1px;}
.hint{font-size:12.5px;color:var(--steel);margin-top:9px;font-style:italic;}
.fb{
  border:1px solid var(--line);
  border-left:3px solid var(--gold);
  background:#101821;
  padding:12px;
  font-size:14px;line-height:1.5;
  margin-top:12px;
}
.fb.ok{border-left-color:var(--green);}
.fb.bad{border-left-color:var(--red);}
.fb .vd{font-weight:800;letter-spacing:1.5px;font-size:12px;display:block;margin-bottom:6px;}
.fb.ok .vd{color:var(--green);}
.fb.bad .vd{color:var(--red);}
.fb b{color:var(--gold);}

/* ---------- KILLFEED ---------- */
#feed{
  position:fixed;right:6px;top:calc(env(safe-area-inset-top) + 6px);
  z-index:60;display:flex;flex-direction:column;gap:4px;
  pointer-events:none;max-width:62vw;
}
.kf{
  background:rgba(10,15,21,.9);
  border:1px solid var(--line);
  border-right:3px solid var(--gold);
  padding:4px 8px;font-size:11px;letter-spacing:.5px;
  animation:kfin .2s ease-out;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kf.ok{border-right-color:var(--green);}
.kf.bad{border-right-color:var(--red);}
.kf .you{color:var(--blue);font-weight:700;}
.kf .vic{color:var(--steel);}
.kf .hs{color:var(--gold);font-weight:800;}
@keyframes kfin{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

/* ---------- THEORY ---------- */
.tcard{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  padding:16px 14px;
  font-size:14.5px;line-height:1.6;
}
.tcard h3{margin:0 0 10px;font-size:16px;color:var(--gold);letter-spacing:.5px;}
.tcard b{color:var(--gold);}
.tcard u{text-decoration-color:var(--gold);}
.tcard .ex{color:var(--green);}
.tcard .bad{color:var(--red);}
.tcard ul{margin:8px 0;padding-left:20px;}
.tcard li{margin-bottom:4px;}
.tnav{display:flex;gap:8px;margin-top:12px;align-items:center;}
.tnav button{flex:1;}
.tnav .cnt{flex:0 0 auto;font-size:12px;color:var(--steel);padding:0 6px;}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 8px;text-align:left;}
.tbl th{background:#0f161e;color:var(--steel);font-weight:600;font-size:12px;letter-spacing:1px;}

/* ---------- RESULT ---------- */
.res{text-align:center;padding:24px 10px;}
.res .big{font-size:44px;font-weight:900;letter-spacing:2px;}
.res .big.win{color:var(--gold);text-shadow:0 0 20px rgba(240,160,60,.4);}
.res .big.lose{color:var(--red);}
.res .rank{font-size:13px;letter-spacing:3px;color:var(--steel);margin-top:6px;}
.res .score{font-size:16px;margin-top:18px;line-height:1.8;}
.res .score b{color:var(--gold);font-size:22px;}

/* ---------- MISC ---------- */
.sfx-toggle{
  position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);
  z-index:60;background:rgba(10,15,21,.92);border:1px solid var(--line);
  color:var(--steel);font-size:11px;padding:6px 9px;cursor:pointer;letter-spacing:1px;
}
.foot{text-align:center;font-size:10.5px;color:#4a5b6d;margin-top:26px;letter-spacing:1px;}
.hidden{display:none !important;}
@media (max-width:420px){
  #feed{max-width:70vw;font-size:10px;}
  .qtext{font-size:16px;}
  .btn{font-size:14.5px;padding:12px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<div id="feed"></div>
<button class="sfx-toggle" id="sfx">ЗВУК: ВКЛ</button>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   ДАННЫЕ
   формат вопроса: Q(текст, [варианты], ответ (индекс или массив), пояснение, тип)
   тип: не указан = один ответ, 'multi' = несколько
   Варианты перемешиваются при показе, поэтому верный можно писать первым.
   ========================================================= */

function Q(t,o,a,e,ty){return{t:t,o:o,a:a,e:e,ty:ty||'one'};}

var SECTIONS=[
/* ================== ЧАСТЬ 1: КОРЕНЬ ================== */
{
 part:'КОРЕНЬ СЛОВА', id:'k1', name:'Три вида корней. Проверяемые гласные (ФИПИ)',
 kind:'ТРЕНИРОВКА',
 theory:[
  {h:'Три вида корней',b:'На занятиях мы делили корни на три вида:<br><br><b>1. Проверяемые</b> — гласную можно проверить ударением: част<span class="ex">о</span>та — ч<span class="ex">а́</span>сто, ч<span class="ex">и</span>стота — ч<span class="ex">и́</span>сто.<br><br><b>2. Непроверяемые (словарные)</b> — проверить нельзя, запоминаем: наслаждение, карандаш, шомпол.<br><br><b>3. Чередующиеся</b> — пишем по особому правилу, ударением <u>не</u> проверяем: заг<span class="ex">о</span>рать, хотя «зага́р».'},
  {h:'Как проверять',b:'Подбираем однокоренное слово или другую форму того же слова, где гласная стоит <b>под ударением</b>:<br><br>ст<span class="ex">е</span>на — ст<span class="ex">е́</span>ны<br>л<span class="ex">и</span>стов — л<span class="ex">и́</span>стья<br>укр<span class="ex">о</span>щать — кр<span class="ex">о́</span>ткий<br>т<span class="ex">я</span>жёлая — т<span class="ex">я́</span>жесть<br>неисч<span class="ex">и</span>слимый — ч<span class="ex">и́</span>сла'},
  {h:'Ловушки проверки',b:'<b>1. Проверочное слово должно быть родственным по смыслу.</b><br>прим<span class="ex">и</span>рить друзей (м<span class="ex">и́</span>р) — прим<span class="ex">е</span>рять платье (прим<span class="ex">е́</span>рка)<br>разв<span class="ex">е</span>вающийся флаг (в<span class="ex">е́</span>ять) — разв<span class="ex">и</span>вающийся ребёнок (разв<span class="ex">и́</span>тие)<br><br><b>2. Нельзя проверять формой на -ывать/-ивать.</b><br>оп<span class="ex">о</span>здать проверяем словом «п<span class="ex">о́</span>здно», а <span class="bad">не</span> «опаздывать».<br><br><b>3. Не проверяй чередующиеся корни ударением</b> — у них своё правило (следующие блоки).'}
 ],
 q:[
  Q('укр__щать (животных)',['о','а'],0,'Кр<b>о́</b>ткий → укр<b>о</b>щать.'),
  Q('прогл__тить',['о','а'],0,'Гл<b>о́</b>тка → прогл<b>о</b>тить.'),
  Q('оч__рование',['а','о'],0,'Ч<b>а́</b>ры → оч<b>а</b>рование.'),
  Q('затв__рдевший',['е','и'],0,'Тв<b>ё</b>рдый → затв<b>е</b>рдевший. Ё под ударением проверяет Е.'),
  Q('пот__рять',['е','и'],0,'Пот<b>е́</b>ря → пот<b>е</b>рять.'),
  Q('присл__ниться',['о','а'],0,'Засл<b>о́</b>нка → присл<b>о</b>ниться.'),
  Q('неув__даемый',['я','е'],0,'Ув<b>я́</b>дший, в<b>я́</b>нуть → неув<b>я</b>даемый.'),
  Q('прим__рить поссорившихся друзей',['и','е'],0,'Значение «мир» → м<b>и́</b>р → прим<b>и</b>рить.'),
  Q('прим__рять новое платье',['е','и'],0,'Значение «мерить» → прим<b>е́</b>рка → прим<b>е</b>рять.'),
  Q('(звёзды) м__рцают',['е','и'],0,'М<b>е́</b>ркнет → м<b>е</b>рцают.'),
  Q('выд__лбленное дупло',['о','а'],0,'Д<b>о́</b>лбит → выд<b>о</b>лбленное.'),
  Q('разв__вающийся на ветру флаг',['е','и'],0,'Флаг веет на ветру: в<b>е́</b>ять → разв<b>е</b>вающийся.'),
  Q('т__жёлая ноша',['я','е'],0,'Т<b>я́</b>жесть → т<b>я</b>жёлая.'),
  Q('осв__щённая улица',['е','я'],0,'Св<b>е́</b>т → осв<b>е</b>щённая.'),
  Q('прот__воположность',['и','е'],0,'Прот<b>и́</b>вник → прот<b>и</b>воположность.'),
  Q('расш__ряются',['и','е'],0,'Ш<b>и́</b>рь → расш<b>и</b>ряются.'),
  Q('зап__лярная ночь',['о','а'],0,'П<b>о́</b>люс → зап<b>о</b>лярная.'),
  Q('с__дых волос',['е','и'],0,'С<b>е́</b>д → с<b>е</b>дых.'),
  Q('неисч__слимых черт',['и','е'],0,'Ч<b>и́</b>сла → неисч<b>и</b>слимых.'),
  Q('пост__пенно',['е','и'],0,'Ст<b>е́</b>пень → пост<b>е</b>пенно.'),
  Q('обн__жив',['а','о'],0,'Н<b>а́</b>г → обн<b>а</b>жив.'),
  Q('в страстной м__льбе',['о','а'],0,'М<b>о́</b>лит → м<b>о</b>льбе.'),
  Q('Каким словом ПРАВИЛЬНО проверить гласную в слове «оп__здать»?',['поздно','опаздывать','опоздание','опаздывающий'],0,'Проверяем ударением: п<b>о́</b>здно. Форма на -ывать для проверки не годится.'),
  Q('Какое слово проверяет гласную в «разв__вающийся на ветру флаг»?',['веять','развитие','вить','развивать'],0,'Флаг колышется от ветра: в<b>е́</b>ять. «Развитие» — другое значение.'),
  Q('Отметь ВСЕ слова, написанные верно.',['увлекательно','преподаватель','радушно','серибристый','противоположность','обвенить'],[0,1,2,4],'Ошибки: сер<b>е</b>бристый (сер<b>е́</b>бряный), обв<b>и</b>нить (в<b>и́</b>на).','multi')
 ]
},
{
 part:'КОРЕНЬ СЛОВА', id:'k2', name:'Словарные слова (ФИПИ)',
 kind:'ТРЕНИРОВКА',
 theory:[
  {h:'Непроверяемые гласные',b:'В некоторых корнях безударную гласную <b>нельзя проверить</b>: проверочного слова с ударением на этом месте просто нет. Такие слова называют <b>словарными</b> и запоминают.<br><br>Не пытайся «проверить» их случайным похожим словом: б<span class="ex">а</span>грянец не связан с «багром», а к<span class="ex">о</span>стры — с «костью».'},

  Q('Где НЕ с причастием пишется раздельно?',['(не)прочитанная мной книга','(не)годующий взгляд','совершенно (не)обоснованный вывод','(не)доработанный проект'],0,'Есть зависимое слово «мной» → раздельно.'),
  Q('Какое прилагательное — притяжательное?',['волчий (след)','стальной','смелый','деревянный'],0,'След (чей?) волка → притяжательное.'),
  Q('В каком слове пишется О?',['свинц__вый','сердц__м','ситц__вый','кольц__вой'],0,'Под ударением → О: свинц<b>о́</b>вый.'),
  Q('В каком ряду во всех словах пишется НН?',['лимо__ый, соломе__ый, стекля__ый','ю__ый, румя__ый, пря__ый','ветре__ый, серебря__ый, бара__ий','кури__ый, ледя__ой, песча__ый'],0,'Лимонный, соломенный, стеклянный.'),
  Q('Какое слово пишется через дефис?',['(по)французски','(по)немногу','(на)встречу гостям','(в)дали плыл корабль'],0,'ПО- + -И → дефис.'),
  Q('Какой глагол I спряжения?',['брить','клеить','видеть','держать'],0,'Брить — исключение, I спр.'),
  Q('Где на месте пропуска пишется И?',['к арми__','к тётушк__','на опушк__','о подмастерь__'],0,'Слова на -ИЯ: Д.п. → И.'),
  Q('Где ошибка в окончании?',['о сином море','в хорошем настроении','с горячим чаем','о дальнем пути'],0,'Правильно: о син<b>ем</b> море.'),
  Q('Отметь ВСЕ слова, написанные верно.',['преемник (президента)','пригородный','безинициативный','сверхинтересный','розыскать','пол-яблока'],[0,1,3,5],'Ошибки: без<b>ы</b>нициативный (Ы после БЕЗ-), р<b>а</b>зыскать (без ударения — А).','multi')
 ]
}
];

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
var STORE='oge-orfo-67-v1';
var state={solved:{},seen:{},sound:true};
SECTIONS.forEach(function(s){state.solved[s.id]={};});
(function(){
  try{
    var raw=localStorage.getItem(STORE); if(!raw)return;
    var d=JSON.parse(raw);
    if(d&&d.solved){SECTIONS.forEach(function(s){var o=d.solved[s.id];if(o){for(var k in o){if(+k<s.q.length)state.solved[s.id][k]=1;}}});}
    if(d&&d.seen)state.seen=d.seen;
    if(d&&d.sound===false)state.sound=false;
  }catch(err){}
})();
function save(){try{localStorage.setItem(STORE,JSON.stringify({solved:state.solved,seen:state.seen,sound:state.sound}));}catch(err){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function secTotal(s){return s.q.length;}
function secSolved(s){return Object.keys(state.solved[s.id]).length;}
function secPct(s){return Math.round(secSolved(s)/secTotal(s)*100);}
function globalTotals(){
  var t=0,d=0;
  SECTIONS.forEach(function(s){t+=secTotal(s);d+=secSolved(s);});
  return{t:t,d:d,p:Math.round(d/t*100)};
}

/* =========================================================
   ЗВУК
   ========================================================= */
var AC=null;
function ac(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  }
  if(AC.state==='suspended'){AC.resume();}
  return AC;
}
document.addEventListener('touchstart',function(){ac();},{once:true,passive:true});
document.addEventListener('mousedown',function(){ac();},{once:true});

function tone(f1,f2,dur,type,vol){
  if(!state.sound)return;
  var c=ac(); if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f1,c.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);
  g.gain.setValueAtTime(vol||0.06,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.connect(g);g.connect(c.destination);
  o.start();o.stop(c.currentTime+dur);
}
function noise(dur,freq,vol){
  if(!state.sound)return;
  var c=ac(); if(!c)return;
  var len=Math.floor(c.sampleRate*dur);
  var buf=c.createBuffer(1,len,c.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);}
  var src=c.createBufferSource();src.buffer=buf;
  var flt=c.createBiquadFilter();flt.type='lowpass';flt.frequency.value=freq||1400;
  var g=c.createGain();g.gain.value=vol||0.14;
  src.connect(flt);flt.connect(g);g.connect(c.destination);
  src.start();
}
var SFX={
  click:function(){tone(520,380,0.04,'square',0.03);},
  select:function(){tone(700,900,0.05,'square',0.035);},
  shot:function(){noise(0.16,1800,0.15);tone(180,70,0.1,'sawtooth',0.05);},
  hit:function(){SFX.shot();setTimeout(function(){tone(1400,2000,0.07,'sine',0.07);},60);},
  headshot:function(){SFX.shot();setTimeout(function(){tone(1600,2400,0.1,'sine',0.08);},60);setTimeout(function(){tone(2400,3000,0.09,'sine',0.06);},140);},
  miss:function(){noise(0.1,500,0.1);tone(150,90,0.22,'sawtooth',0.07);},
  win:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,f*1.02,0.16,'square',0.06);},i*110);});},
  fail:function(){[330,262,196].forEach(function(f,i){setTimeout(function(){tone(f,f*0.9,0.22,'sawtooth',0.055);},i*150);});},
  reload:function(){tone(240,180,0.06,'square',0.045);setTimeout(function(){tone(300,420,0.06,'square',0.045);},90);}
};

document.getElementById('sfx').textContent='ЗВУК: '+(state.sound?'ВКЛ':'ВЫКЛ');
document.getElementById('sfx').onclick=function(){
  state.sound=!state.sound;save();
  this.textContent='ЗВУК: '+(state.sound?'ВКЛ':'ВЫКЛ');
  if(state.sound){ac();SFX.click();}
};

/* =========================================================
   KILL FEED
   ========================================================= */
function feed(victim,ok,label){
  var f=document.getElementById('feed');
  var d=document.createElement('div');
  d.className='kf '+(ok?'ok':'bad');
  d.innerHTML=ok
    ? '<span class="you">ТЫ</span> ⟶ <span class="vic">'+victim+'</span>'+(label?' <span class="hs">'+label+'</span>':'')
    : '<span class="vic">'+victim+'</span> ⟶ <span class="you">ТЫ</span>';
  f.appendChild(d);
  setTimeout(function(){
    d.style.transition='opacity .4s';d.style.opacity='0';
    setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},400);
  },2600);
  while(f.children.length>4){f.removeChild(f.firstChild);}
}

/* =========================================================
   РЕНДЕР: МЕНЮ
   ========================================================= */
var app=document.getElementById('app');

function renderMenu(){
  var g=globalTotals();
  var h='';
  h+='<div class="logo">'+
     '<h1>ОПЕРАЦИЯ: ОГЭ</h1>'+
     '<div class="sub">ОРФОГРАФИЯ · ЗАДАНИЯ 6–7 · ИТОГОВЫЙ ТЕСТ</div>'+
     '<div class="crate">'+SECTIONS.length+' БЛОКОВ · '+g.t+' ВОПРОСОВ</div>'+
     '</div>';
  h+='<div class="gbar-box">'+
     '<div class="gbar-top"><span>ОБЩИЙ ПРОГРЕСС</span><b>'+g.p+'%</b></div>'+
     '<div class="bar"><i style="width:'+g.p+'%"></i></div>'+
     '<div class="gstats"><span>решено <b>'+g.d+'</b> из <b>'+g.t+'</b></span>'+
     '<span>блоков пройдено <b>'+SECTIONS.filter(function(s){return secPct(s)===100;}).length+'</b> / '+SECTIONS.length+'</span></div>'+
     '</div>';

  var lastPart=null,n=0;
  SECTIONS.forEach(function(s,i){
    if(s.part!==lastPart){
      lastPart=s.part;
      var pq=SECTIONS.filter(function(x){return x.part===s.part;});
      var pt=0,pd=0;
      pq.forEach(function(x){pt+=secTotal(x);pd+=secSolved(x);});
      h+='<div class="part-h"><span>'+s.part+'</span><em>'+Math.round(pd/pt*100)+'%</em></div>';
    }
    n++;
    var p=secPct(s);
    var tagCls=s.kind==='ИСКЛЮЧЕНИЯ'?'t3':(s.kind==='ЭКЗАМЕН'?'':'t2');
    h+='<div class="item'+(p===100?' done':'')+'" data-i="'+i+'">'+
       '<div class="num">'+(p===100?'✔':n)+'</div>'+
       '<div class="mid">'+
         '<div class="nm">'+s.name+'</div>'+
         '<div class="meta"><span class="tag '+tagCls+'">'+s.kind+'</span>'+secSolved(s)+' / '+secTotal(s)+' вопросов</div>'+
         '<div class="lbar"><i style="width:'+p+'%"></i></div>'+
       '</div>'+
       '<div class="pc">'+p+'%</div>'+
       '</div>';
  });
  h+='<button class="act ghost" id="reset" style="margin-top:22px">СБРОСИТЬ ПРОГРЕСС</button>';
  h+='<div class="foot">ТРЕНАЖЁР ПО РУССКОМУ ЯЗЫКУ · ОРФОГРАФИЯ ДЛЯ ОГЭ</div>';
  app.innerHTML=h;
  document.getElementById('reset').onclick=function(){
    if(!confirm('Сбросить весь прогресс? Проценты обнулятся, брифинги снова станут обязательными.'))return;
    SECTIONS.forEach(function(s){state.solved[s.id]={};});
    state.seen={};save();SFX.click();renderMenu();
  };
  Array.prototype.forEach.call(app.querySelectorAll('.item'),function(el){
    el.onclick=function(){SFX.reload();openSection(parseInt(el.dataset.i,10));};
  });
  window.scrollTo(0,0);
}

/* =========================================================
   ТЕОРИЯ
   ========================================================= */
var tIdx=0,curSec=null;

function openSection(i){
  curSec=SECTIONS[i];
  tIdx=0;
  if(curSec.theory&&curSec.theory.length)renderTheory();
  else startDrill();
}

function hudHTML(local,extra){
  var g=globalTotals();
  return '<div class="hud">'+
    '<div class="hud-r1">'+
      '<button class="back" id="back">← МЕНЮ</button>'+
      '<div class="hud-title">'+curSec.name+'</div>'+
      '<div class="ammo">'+(extra||'')+'</div>'+
    '</div>'+
    '<div class="hud-r2"><span class="lab">БЛОК</span><div class="bar"><i style="width:'+local+'%"></i></div><span class="val">'+local+'%</span></div>'+
    '<div class="hud-r2 g"><span class="lab">ВСЕГО</span><div class="bar"><i style="width:'+g.p+'%"></i></div><span class="val">'+g.p+'%</span></div>'+
  '</div>';
}

function renderTheory(){
  var t=curSec.theory[tIdx];
  var h=hudHTML(secPct(curSec),'БРИФИНГ');
  h+='<div class="tcard"><h3>'+t.h+'</h3>'+t.b+'</div>';
  h+='<div class="tnav">'+
      '<button class="act ghost" id="tprev"'+(tIdx===0?' disabled style="opacity:.4"':'')+'>◀ НАЗАД</button>'+
      '<span class="cnt">'+(tIdx+1)+' / '+curSec.theory.length+'</span>'+
      (tIdx<curSec.theory.length-1
        ? '<button class="act ghost" id="tnext">ДАЛЕЕ ▶</button>'
        : '<button class="act" id="tgo">К ЗАДАНИЯМ</button>')+
     '</div>';
  if(tIdx<curSec.theory.length-1&&state.seen[curSec.id]){
    h+='<button class="act ghost" id="skip" style="margin-top:14px">ПРОПУСТИТЬ БРИФИНГ</button>';
  }
  if(!state.seen[curSec.id]&&tIdx===0){
    h+='<div class="hint" style="margin-top:12px">Сначала теория: пролистай брифинг до конца, потом откроются задания.</div>';
  }
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){SFX.click();renderMenu();};
  var pv=document.getElementById('tprev');
  if(pv)pv.onclick=function(){if(tIdx>0){tIdx--;SFX.click();renderTheory();}};
  var nx=document.getElementById('tnext');
  if(nx)nx.onclick=function(){tIdx++;SFX.click();renderTheory();};
  var go=document.getElementById('tgo');
  if(go)go.onclick=function(){SFX.reload();startDrill();};
  var sk=document.getElementById('skip');
  if(sk)sk.onclick=function(){SFX.reload();startDrill();};
  window.scrollTo(0,0);
}

/* =========================================================
   ТРЕНИРОВКА
   ========================================================= */
var queue=[],qi=0,answered=false,picked=[],streak=0,stats={hit:0,miss:0};

function startDrill(){
  queue=[];
  for(var i=0;i<curSec.q.length;i++)queue.push(i);
  shuffle(queue);
  if(!state.seen[curSec.id]){state.seen[curSec.id]=1;save();}
  qi=0;streak=0;stats={hit:0,miss:0};
  renderQ();
}

function renderQ(){
  if(qi>=queue.length){renderResult();return;}
  answered=false;picked=[];
  var idx=queue[qi];
  var q=curSec.q[idx];
  var left=queue.length-qi;
  var label=q.ty==='multi'?'ВЫБЕРИ ВСЕ ВЕРНЫЕ ВАРИАНТЫ':(q.ty==='odd'?'НАЙДИ ЛИШНЕЕ':'ВЫБЕРИ ОДИН ВАРИАНТ');
  var h=hudHTML(secPct(curSec),'ЦЕЛЕЙ <b>'+left+'</b>');
  h+='<div class="qcard"><div class="qtype">'+label+(streak>1?' · СЕРИЯ '+streak:'')+'</div>'+
     '<div class="qtext">'+q.t.replace(/__/g,'<span class="gap">__</span>')+'</div>';
  if(q.ty==='multi')h+='<div class="hint">Отметь нужные варианты и нажми «Огонь».</div>';
  h+='</div>';
  h+='<div id="opts">';
  var ord=shuffle(q.o.map(function(x,i){return i;}));
  ord.forEach(function(i,pos){
    h+='<button class="btn" data-o="'+i+'"><span class="k">'+String.fromCharCode(65+pos)+'</span>'+q.o[i]+'</button>';
  });
  h+='</div>';
  if(q.ty==='multi')h+='<button class="act" id="fire">ОГОНЬ</button>';
  h+='<div id="after"></div>';
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){SFX.click();renderMenu();};
  Array.prototype.forEach.call(app.querySelectorAll('#opts .btn'),function(b){
    b.onclick=function(){onPick(parseInt(b.dataset.o,10),b);};
  });
  var f=document.getElementById('fire');
  if(f)f.onclick=function(){checkMulti();};
  window.scrollTo(0,0);
}

function onPick(i,btn){
  if(answered)return;
  var q=curSec.q[queue[qi]];
  if(q.ty==='multi'){
    SFX.select();
    var p=picked.indexOf(i);
    if(p>=0){picked.splice(p,1);btn.classList.remove('sel');}
    else{picked.push(i);btn.classList.add('sel');}
    return;
  }
  picked=[i];
  grade(i===q.a);
}

function checkMulti(){
  if(answered)return;
  var q=curSec.q[queue[qi]];
  if(!picked.length){SFX.miss();return;}
  var a=q.a.slice().sort().join(',');
  var p=picked.slice().sort(function(x,y){return x-y;}).join(',');
  grade(a===p);
}

function grade(ok){
  answered=true;
  var idx=queue[qi];
  var q=curSec.q[idx];
  var btns=app.querySelectorAll('#opts .btn');
  var correct=q.ty==='multi'?q.a:[q.a];
  Array.prototype.forEach.call(btns,function(b){
    var i=parseInt(b.dataset.o,10);
    b.disabled=true;b.classList.remove('sel');
    if(correct.indexOf(i)>=0)b.classList.add('ok');
    else if(picked.indexOf(i)>=0)b.classList.add('bad');
  });
  var fire=document.getElementById('fire');
  if(fire)fire.remove();

  var vic=(q.ty==='multi'?'ИСКЛЮЧЕНИЯ':stripTags(q.o[correct[0]]));
  if(vic.length>22)vic=vic.slice(0,21)+'…';

  if(ok){
    stats.hit++;streak++;
    if(!state.solved[curSec.id][idx]){state.solved[curSec.id][idx]=1;save();}
    var lbl=streak>=6?'RAMPAGE':(streak>=4?'TRIPLE KILL':(streak>=2?'DOUBLE KILL':'HEADSHOT'));
    if(streak>=2)SFX.headshot();else SFX.hit();
    feed(vic,true,lbl);
  }else{
    stats.miss++;streak=0;
    SFX.miss();
    feed(vic,false);
    queue.push(idx); // вернём вопрос в конец очереди
  }

  var fb='<div class="fb '+(ok?'ok':'bad')+'">'+
    '<span class="vd">'+(ok?'ЦЕЛЬ ПОРАЖЕНА':'ПРОМАХ')+'</span>'+q.e+'</div>';
  fb+='<button class="act" id="next">ДАЛЬШЕ</button>';
  var after=document.getElementById('after');
  after.innerHTML=fb;
  document.getElementById('next').onclick=function(){
    SFX.click();qi++;renderQ();
  };
  // обновить HUD
  var loc=secPct(curSec),g=globalTotals();
  var bars=app.querySelectorAll('.hud-r2');
  bars[0].querySelector('i').style.width=loc+'%';
  bars[0].querySelector('.val').textContent=loc+'%';
  bars[1].querySelector('i').style.width=g.p+'%';
  bars[1].querySelector('.val').textContent=g.p+'%';
  try{after.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
}

function stripTags(s){return String(s).replace(/<[^>]*>/g,'');}

/* =========================================================
   РЕЗУЛЬТАТ
   ========================================================= */
function renderResult(){
  var total=stats.hit+stats.miss;
  var acc=total?Math.round(stats.hit/total*100):0;
  var win=acc>=80;
  if(win)SFX.win();else SFX.fail();
  var rank=acc>=95?'GLOBAL ELITE':acc>=85?'SUPREME':acc>=70?'LEGENDARY EAGLE':acc>=55?'GOLD NOVA':'SILVER';
  var g=globalTotals();
  var h=hudHTML(secPct(curSec),'ИТОГ');
  h+='<div class="res">'+
     '<div class="big '+(win?'win':'lose')+'">'+(win?'VICTORY':'ROUND OVER')+'</div>'+
     '<div class="rank">РАНГ БЛОКА: '+rank+'</div>'+
     '<div class="score">'+
       'Точность: <b>'+acc+'%</b><br>'+
       'Попаданий: '+stats.hit+' · Промахов: '+stats.miss+'<br>'+
       'Блок «'+curSec.name+'»: <b>'+secPct(curSec)+'%</b><br>'+
       'Общий прогресс: <b>'+g.p+'%</b>'+
     '</div>'+
     '</div>';
  h+='<button class="act" id="again">ПРОЙТИ БЛОК СНОВА</button>';
  var i=SECTIONS.indexOf(curSec);
  if(i<SECTIONS.length-1)h+='<button class="act ghost" id="nextsec">СЛЕДУЮЩИЙ БЛОК ▶</button>';
  h+='<button class="act ghost" id="tomenu">В ОГЛАВЛЕНИЕ</button>';
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){SFX.click();renderMenu();};
  document.getElementById('again').onclick=function(){SFX.reload();startDrill();};
  document.getElementById('tomenu').onclick=function(){SFX.click();renderMenu();};
  var ns=document.getElementById('nextsec');
  if(ns)ns.onclick=function(){SFX.reload();openSection(i+1);};
  window.scrollTo(0,0);
}

renderMenu();
</script>
