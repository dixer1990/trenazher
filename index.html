<style>
:root{
  --bg:#0d1117;--bg2:#141b24;--panel:#1a232e;--panel2:#222d3a;--line:#2e3d4d;
  --gold:#f0a03c;--gold-dim:#8a5e22;--steel:#8fa3b8;--white:#e8eef5;
  --green:#87c442;--red:#d1453b;--grey:#6b7785;
  --u:10px; /* 1% ширины карты, пересчитывается скриптом */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  margin:0;background:radial-gradient(circle at 50% 0%,#1b2836 0%,var(--bg) 55%),var(--bg);
  color:var(--white);font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
  min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 50px;}

/* ---------- ШАПКА ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin:6px 0 14px;}
.brand .kicker{font-size:11px;letter-spacing:3px;color:var(--steel);}
.brand h1{margin:4px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:2px;color:var(--gold);
  text-shadow:0 0 18px rgba(240,160,60,.35);font-weight:800;line-height:1.1;}
.gbox{flex:1 1 280px;max-width:430px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;}
.gtop{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:1.5px;color:var(--steel);}
.gtop b{color:var(--gold);font-size:18px;letter-spacing:0;}
.bar{height:8px;background:#0a0f15;border:1px solid var(--line);margin-top:7px;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .6s;}
.gsub{font-size:11.5px;color:var(--steel);margin-top:6px;}
.gsub b{color:var(--white);}

/* ---------- КАРТА ---------- */
.frame{position:relative;border:1px solid var(--line);background:#000;padding:4px;
  box-shadow:0 10px 40px rgba(0,0,0,.55);}
.frame:before,.frame:after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--gold);z-index:3;pointer-events:none;}
.frame:before{left:-3px;top:-3px;border-right:0;border-bottom:0;}
.frame:after{right:-3px;bottom:-3px;border-left:0;border-top:0;}
.map{position:relative;width:100%;aspect-ratio:2000/1131;overflow:hidden;user-select:none;-webkit-user-select:none;}
.map img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;}
.map .shade{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 100%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);}
.map .grid{position:absolute;inset:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:12.5% 22.2%;}
.map .sweep{position:absolute;left:50%;top:50%;width:220%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;
  background:conic-gradient(from 0deg,rgba(135,196,66,0) 0deg,rgba(135,196,66,0) 300deg,rgba(135,196,66,.08) 350deg,rgba(135,196,66,.2) 360deg);
  animation:sweep 7s linear infinite;mix-blend-mode:screen;}
@keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg);}}

/* точки */
.pt{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;font:inherit;z-index:2;}
.pt .dot{position:relative;width:clamp(26px,calc(var(--u)*3.6),54px);height:clamp(26px,calc(var(--u)*3.6),54px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(8,12,17,.78);border:3px solid var(--gold);color:var(--gold);
  font-weight:800;font-size:clamp(12px,calc(var(--u)*1.7),24px);box-shadow:0 0 0 3px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.6);
  transition:transform .15s;}
.pt:hover .dot,.pt:focus-visible .dot{transform:scale(1.12);}
.pt:active .dot{transform:scale(.94);}
.pt.open .dot:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--gold);animation:ping 2.2s ease-out infinite;}
@keyframes ping{0%{transform:scale(1);opacity:.9;}100%{transform:scale(1.9);opacity:0;}}
.pt.done .dot{border-color:var(--green);color:var(--green);}
.pt.done .dot:after{border-color:var(--green);}
.pt.locked .dot{border-color:var(--grey);color:#aab3bd;background:rgba(8,12,17,.66);}
.pt.center .dot{width:clamp(32px,calc(var(--u)*4.6),68px);height:clamp(32px,calc(var(--u)*4.6),68px);border-color:var(--red);color:#ff6a5c;}
.pt.center.locked .dot{border-color:#8a3a33;color:#e0877e;}
.pt .lbl{margin-top:clamp(3px,calc(var(--u)*.5),7px);background:rgba(8,12,17,.86);border:1px solid rgba(255,255,255,.12);
  padding:clamp(2px,calc(var(--u)*.3),5px) clamp(5px,calc(var(--u)*.8),11px);white-space:nowrap;
  font-size:clamp(10px,calc(var(--u)*1.3),17px);font-weight:700;letter-spacing:.3px;color:var(--white);line-height:1.25;}
.pt .lbl em{font-style:normal;color:var(--gold);margin-left:.35em;}
.pt.done .lbl em{color:var(--green);}
.pt.locked .lbl{color:#c9d1da;}
.pt.locked .lbl em{color:var(--grey);font-weight:600;}
.map.small .pt .lbl{display:none;}

.hint{text-align:center;font-size:12.5px;color:var(--steel);letter-spacing:1px;margin:12px 0 18px;}

/* ---------- СПИСОК ТОЧЕК ---------- */
.list-h{font-size:12px;letter-spacing:3px;color:var(--steel);margin:6px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:11px 12px;
  cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;}
.row:hover{border-color:var(--gold-dim);}
.row .num{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;}
.row.done .num{border-color:var(--green);color:var(--green);}
.row.locked .num{border-color:var(--grey);color:#aab3bd;}
.row.center .num{border-color:var(--red);color:#ff6a5c;}
.row .mid{flex:1;min-width:0;}
.row .nm,.row .meta,.row .bar{display:block;}
.row .nm{font-weight:700;font-size:15px;line-height:1.25;}
.row .meta{font-size:11.5px;color:var(--steel);margin-top:2px;}
.row .bar{height:5px;margin-top:6px;}
.row .pc{flex:0 0 auto;font-weight:800;color:var(--gold);font-size:15px;}
.row.done .pc{color:var(--green);}
.row.locked .pc{color:var(--grey);font-size:12px;letter-spacing:1px;font-weight:700;}

/* ---------- КАРТОЧКА ТОЧКИ ---------- */
.ov{position:fixed;inset:0;background:rgba(4,7,10,.72);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;}
.ov.show{opacity:1;pointer-events:auto;}
.card{position:relative;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--bg2);
  border:1px solid var(--line);border-top:3px solid var(--gold);padding:18px 18px 16px;
  transform:translateY(10px);transition:transform .18s;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.ov.show .card{transform:none;}
.card.locked{border-top-color:var(--grey);}
.card .x{position:absolute;right:6px;top:6px;width:40px;height:40px;background:none;border:0;color:var(--steel);font-size:22px;cursor:pointer;}
.card .k{font-size:11px;letter-spacing:3px;color:var(--steel);}
.card h2{margin:5px 40px 4px 0;font-size:22px;line-height:1.2;color:var(--white);}
.card .tasks{font-size:13px;color:var(--gold);letter-spacing:.5px;}
.card.locked .tasks{color:#aab3bd;}
.card p{font-size:14px;color:#c3ceda;line-height:1.45;margin:10px 0 12px;}
.card .pp{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1.5px;color:var(--steel);margin-top:4px;}
.card .pp b{color:var(--gold);font-size:16px;letter-spacing:0;}
.tr{background:var(--panel);border:1px solid var(--line);padding:12px;margin-top:10px;}
.tr .tt{font-weight:700;font-size:15.5px;line-height:1.25;}
.tr .ti{font-size:12px;color:var(--steel);margin-top:3px;}
.tr .trow{display:flex;align-items:center;gap:10px;margin-top:9px;}
.tr .trow .bar{flex:1;margin-top:0;}
.tr .trow b{font-size:14px;color:var(--gold);min-width:40px;text-align:right;}
.go{display:block;margin-top:11px;text-align:center;text-decoration:none;font-weight:800;letter-spacing:2px;font-size:15px;
  color:#16100a;background:linear-gradient(180deg,#ffb54f,var(--gold));border:1px solid #ffcb80;padding:12px;}
.go:active{filter:brightness(.9);}
.soon{margin-top:12px;border:1px dashed var(--grey);color:#c9d1da;text-align:center;padding:14px;font-size:14px;letter-spacing:1px;}
.soon b{display:block;color:var(--white);letter-spacing:3px;font-size:15px;margin-bottom:4px;}

.foot{text-align:center;font-size:11px;color:#4f6072;margin-top:28px;letter-spacing:.8px;line-height:1.6;}

@media (max-width:520px){
  .wrap{padding:10px 12px 40px;}
  .gbox{max-width:none;}
  .list{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
  .map .sweep{display:none;}
}
</style>
</head>

      <div class="sweep"></div>
      <div class="shade"></div>
    </div>
  </div>
  <div class="hint">Нажми на точку, чтобы начать</div>

  <div class="list-h">ТОЧКИ НА КАРТЕ</div>
  <div class="list" id="list"></div>

  <div class="foot">Номера заданий — по проекту демоверсии ОГЭ 2027.<br>Прогресс хранится в этом браузере на этом устройстве.</div>
</div>

<div class="ov" id="ov"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
/* ---------- ПРОГРЕСС ---------- */
function trainerStats(t){
  var r={done:0,total:t.total||0};
  try{
    var raw=localStorage.getItem(t.store); if(!raw)return r;
    var d=JSON.parse(raw); if(!d)return r;
    if(typeof d.done==='number'&&d.total){return {done:d.done,total:d.total};}
    if(d.solved){var n=0;for(var s in d.solved){if(d.solved[s])n+=Object.keys(d.solved[s]).length;}r.done=Math.min(n,r.total);}
  }catch(e){}
  return r;
}
function pct(d,t){return t?Math.round(d/t*100):0;}
function pointStats(p){
  var d=0,t=0;
  p.trainers.forEach(function(tr){var s=trainerStats(tr);d+=s.done;t+=s.total;});
  return {done:d,total:t,p:pct(d,t)};
}

/* ---------- ЗВУК ---------- */
var AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended'){AC.resume();}
  return AC;
}
document.addEventListener('touchstart',function(){ac();},{once:true,passive:true});
document.addEventListener('mousedown',function(){ac();},{once:true});
function tone(f1,f2,dur,type,vol){
  var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);
  g.gain.setValueAtTime(vol||0.04,c.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur+0.02);
}
var SFX={
  open:function(){tone(700,900,0.05,'square',0.035);setTimeout(function(){tone(1100,1300,0.05,'square',0.03);},60);},
  deny:function(){tone(220,160,0.14,'sawtooth',0.04);},
  go:function(){tone(240,180,0.06,'square',0.045);setTimeout(function(){tone(300,420,0.06,'square',0.045);},90);}
};

/* ---------- ОТРИСОВКА ---------- */
var mapEl=document.getElementById('map'),listEl=document.getElementById('list');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pointState(p,st){
  if(!p.trainers.length)return 'locked';
  return st.p>=100?'done':'open';
}

function render(){
  Array.prototype.forEach.call(mapEl.querySelectorAll('.pt'),function(el){el.parentNode.removeChild(el);});
  var lh='',gd=0,gt=0,opened=0;
  POINTS.forEach(function(p,i){
    var st=pointStats(p),s=pointState(p,st);
    if(s!=='locked'){opened++;gd+=st.done;gt+=st.total;}
    var tag=s==='locked'?'скоро':st.p+'%';
    var b=document.createElement('button');
    b.type='button';
    b.className='pt '+s+(p.center?' center':'');
    b.style.left=p.x+'%';b.style.top=p.y+'%';
    b.setAttribute('aria-label','Точка '+p.n+': '+p.name+', '+tag);
    b.innerHTML='<span class="dot">'+(s==='locked'?'&#128274;':p.n)+'</span>'+
                '<span class="lbl">'+esc(p.short)+'<em>'+tag+'</em></span>';
    b.onclick=function(){openCard(i);};
    mapEl.appendChild(b);

    lh+='<button type="button" class="row '+s+(p.center?' center':'')+'" data-i="'+i+'">'+
        '<span class="num">'+p.n+'</span>'+
        '<span class="mid"><span class="nm">'+esc(p.name)+'</span>'+
        '<span class="meta">Задания ОГЭ: '+esc(p.tasks)+(s==='locked'?'':' · тренажёров: '+p.trainers.length)+'</span>'+
        (s==='locked'?'':'<span class="bar"><i style="width:'+st.p+'%"></i></span>')+
        '</span><span class="pc">'+(s==='locked'?'СКОРО':st.p+'%')+'</span></button>';
  });
  listEl.innerHTML=lh;
  Array.prototype.forEach.call(listEl.querySelectorAll('.row'),function(el){
    el.onclick=function(){openCard(parseInt(el.getAttribute('data-i'),10));};
  });
  var gp=pct(gd,gt);
  document.getElementById('gp').textContent=gp+'%';
  document.getElementById('gbar').style.width=gp+'%';
  document.getElementById('gsub').innerHTML='решено <b>'+gd+'</b> из <b>'+gt+'</b> · открыто точек <b>'+opened+'</b> / '+POINTS.length;
  sizeMap();
}

/* ---------- КАРТОЧКА ---------- */
var ov=document.getElementById('ov'),card=document.getElementById('card'),lastFocus=null;
function openCard(i){
  var p=POINTS[i],st=pointStats(p),s=pointState(p,st);
  lastFocus=document.activeElement;
  var h='<button class="x" type="button" aria-label="Закрыть">&#10005;</button>'+
        '<div class="k">ТОЧКА '+p.n+(p.center?' · ЦЕНТР КАРТЫ':'')+'</div>'+
        '<h2>'+esc(p.name)+'</h2>'+
        '<div class="tasks">Задания ОГЭ: '+esc(p.tasks)+'</div>'+
        '<p>'+esc(p.about)+'</p>';
  if(s==='locked'){
    h+='<div class="soon"><b>ТОЧКА ЗАКРЫТА</b>Тренажёр скоро появится</div>';
    card.className='card locked';SFX.deny();
  }else{
    if(p.trainers.length>1){
      h+='<div class="pp"><span>ПРОГРЕСС ТОЧКИ</span><b>'+st.p+'%</b></div><div class="bar"><i style="width:'+st.p+'%"></i></div>';
    }
    p.trainers.forEach(function(t){
      var ts=trainerStats(t),tp=pct(ts.done,ts.total);
      h+='<div class="tr"><div class="tt">'+esc(t.title)+'</div>'+
         '<div class="ti">'+esc(t.info||'')+' · решено '+ts.done+' из '+ts.total+'</div>'+
         '<div class="trow"><div class="bar"><i style="width:'+tp+'%"></i></div><b>'+tp+'%</b></div>'+
         '<a class="go" href="'+esc(t.file)+'">'+(tp>0&&tp<100?'ПРОДОЛЖИТЬ':(tp>=100?'ПОВТОРИТЬ':'В БОЙ'))+' &#9656;</a></div>';
    });
    card.className='card';SFX.open();
  }
  card.innerHTML=h;
  card.querySelector('.x').onclick=closeCard;
  Array.prototype.forEach.call(card.querySelectorAll('.go'),function(a){a.addEventListener('click',function(){SFX.go();});});
  ov.classList.add('show');
  setTimeout(function(){var f=card.querySelector('.go')||card.querySelector('.x');if(f)f.focus({preventScroll:true});},30);
}
function closeCard(){ov.classList.remove('show');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
ov.addEventListener('click',function(e){if(e.target===ov)closeCard();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('show'))closeCard();});

/* ---------- РАЗМЕРЫ ---------- */
function sizeMap(){
  var w=mapEl.getBoundingClientRect().width;
  if(!w)return;
  document.documentElement.style.setProperty('--u',(w/100)+'px');
  mapEl.classList.toggle('small',w<560);
}
window.addEventListener('resize',sizeMap);
window.addEventListener('orientationchange',function(){setTimeout(sizeMap,200);});
/* обновить проценты, когда ученик вернулся с тренажёра кнопкой «назад» */
window.addEventListener('pageshow',function(){render();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)render();});
render();
</script>
