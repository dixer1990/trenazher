/* ============ ЗАСТАВКА ============ */
#title{position:fixed;inset:0;overflow:hidden;background:#7ec0ff;z-index:5;}
#scene{position:absolute;inset:0;transform-origin:50% 70%;transition:transform 1.1s cubic-bezier(.6,0,.4,1),filter 1.1s;}
#scene video,#scene .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;}
#scene .layer{pointer-events:none;}
#fallback{position:absolute;inset:0;}
#fallback .sky{position:absolute;inset:0;background:linear-gradient(#5aa8ff 0%,#9fd3ff 62%,#c8ecff 70%);}
#fallback .sun{position:absolute;left:12%;top:9%;width:9vmin;height:9vmin;background:#fff6a0;box-shadow:0 0 0 1.4vmin #ffe25a,0 0 6vmin 3vmin rgba(255,230,90,.55);}
#fallback .cloud{position:absolute;height:4vmin;background:#fff;box-shadow:4vmin 2vmin 0 #fff,-3vmin 2vmin 0 #f2f8ff;animation:drift 60s linear infinite;}
#fallback .hill{position:absolute;bottom:28%;width:30%;height:22%;background:#6f9b5a;box-shadow:inset 0 2vmin 0 #8fbf6a;}
#fallback .grass{position:absolute;left:0;right:0;bottom:0;height:30%;background:
  linear-gradient(#6ac238 0 18%,#4f9a2a 18% 22%,#86603a 22%),#86603a;}
#fallback .fbench{position:absolute;left:50%;bottom:24%;width:20vmin;height:20vmin;transform:translateX(-50%);}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

#benchHit{position:absolute;z-index:3;cursor:pointer;background:transparent;border:0;padding:0;}
#benchGlow{position:absolute;z-index:2;pointer-events:none;
  border:3px solid rgba(255,255,255,.0);
  animation:glow 1.6s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,240,150,0),inset 0 0 0 0 rgba(255,255,255,0);}50%{box-shadow:0 0 24px 6px rgba(255,240,150,.55),inset 0 0 18px 2px rgba(255,255,255,.25);}}
#benchLayer{position:absolute;z-index:1;pointer-events:none;transform-origin:50% 100%;transition:transform .25s;}
#benchLayer.breath{animation:breath 1.6s ease-in-out infinite;}
@keyframes breath{0%,100%{transform:scale(1);}50%{transform:scale(1.035);filter:drop-shadow(0 0 10px rgba(255,240,150,.9)) brightness(1.08);}}
#benchLayer.hover{animation:none;transform:scale(1.06);filter:drop-shadow(0 0 14px rgba(255,255,255,1)) brightness(1.15);}

.logo{position:absolute;left:0;right:0;top:calc(5vh + env(safe-area-inset-top));text-align:center;z-index:4;pointer-events:none;}
.logo .word{display:inline-block;font-size:clamp(40px,10vw,118px);line-height:1;letter-spacing:.04em;
  color:#d9d9d9;
  background:linear-gradient(#f4f4f4 0 30%,#bdbdbd 30% 55%,#9a9a9a 55% 80%,#7d7d7d 80%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(.05em .05em 0 #3b3b3b) drop-shadow(.05em .05em 0 #262626) drop-shadow(0 0 .02em #000);
}
.logo .tag{display:block;margin-top:.6em;font-size:clamp(13px,2.3vw,22px);letter-spacing:.18em;color:#fff;text-shadow:2px 2px 0 #3a3a3a;}
.splash{position:absolute;z-index:4;pointer-events:none;color:#ffff3c;text-shadow:2px 2px 0 #3f3f00;
  font-size:clamp(14px,2.6vw,26px);white-space:nowrap;transform:rotate(-16deg);animation:pulse .55s ease-in-out infinite alternate;
  right:calc(12% + env(safe-area-inset-right));top:calc(5vh + clamp(52px,12vw,140px));}
@keyframes pulse{from{transform:rotate(-16deg) scale(1);}to{transform:rotate(-16deg) scale(1.09);}}
#tapHint{position:absolute;z-index:4;transform:translate(-50%,-100%);pointer-events:none;text-align:center;
  font-size:clamp(14px,2.4vw,22px);color:#fff;text-shadow:2px 2px 0 #333;white-space:nowrap;animation:bob 1s ease-in-out infinite;}
#tapHint .arr{display:block;font-size:1.3em;line-height:1;margin-top:.15em;}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-8px}}
.tbtn{position:absolute;z-index:6;bottom:calc(14px + env(safe-area-inset-bottom));font-size:14px;}
#tSound{left:calc(14px + env(safe-area-inset-left));}
#tFull{right:calc(14px + env(safe-area-inset-right));}
#startOv{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:calc(14vh + env(safe-area-inset-bottom));background:linear-gradient(transparent 45%,rgba(0,0,0,.45));transition:opacity .5s;}
#startOv.gone{opacity:0;pointer-events:none;}
.mbtn.play{font-size:clamp(22px,3.4vw,30px);min-width:min(320px,70vw);min-height:64px;}
.ovhint{margin-top:10px;font-size:15px;color:#fff;text-shadow:2px 2px 0 #333;}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;transition:opacity .25s;}
.chip{position:absolute;z-index:8;width:10px;height:10px;pointer-events:none;}

/* ============ КНОПКИ В СТИЛЕ БЛОКОВ ============ */
.mbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:44px;padding:8px 16px;border:2px solid #000;
  background:linear-gradient(#8a8a8a,#6f6f6f);
  box-shadow:inset 2px 2px 0 #b5b5b5,inset -2px -3px 0 #4a4a4a;
  color:#fff;text-shadow:2px 2px 0 #3e3e3e;font-size:17px;letter-spacing:.03em;cursor:pointer;
}
.mbtn:hover,.mbtn:focus-visible{background:linear-gradient(#8ea0cf,#6c7fb3);box-shadow:inset 2px 2px 0 #c3ceff,inset -2px -3px 0 #3d4a7a;color:#ffffa0;outline:none;}
.mbtn:active{transform:translateY(1px);}
.mbtn:disabled{background:#3a3a3a;box-shadow:none;color:#888;text-shadow:none;cursor:default;}
.mbtn.green{background:linear-gradient(#5fae3c,#3f8526);box-shadow:inset 2px 2px 0 #9be07a,inset -2px -3px 0 #275717;}
.mbtn.wide{display:flex;width:100%;margin-top:10px;}
.mbtn.small{min-height:36px;font-size:14px;padding:6px 12px;}

/* ============ ОБЩИЙ ФОН МЕНЮ ============ */
#app{position:relative;min-height:100%;
  padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));}
#bg{position:fixed;inset:0;z-index:0;background:#3b2a1c;}
#bg .ph{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(10px) brightness(.38) saturate(1.05);}
#bg .dirt{position:absolute;inset:0;opacity:.18;background-size:64px 64px;image-rendering:pixelated;}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;}

/* панель интерфейса */
.panel{
  background:var(--ui);color:var(--txt);
  border:2px solid #000;border-radius:6px;
  box-shadow:inset 3px 3px 0 var(--ui-hi),inset -3px -3px 0 var(--ui-lo);
  padding:14px;margin:12px 0;
}
.panel h2{margin:0 0 10px;font-weight:normal;font-size:20px;color:var(--txt);letter-spacing:.03em;}
.slot{
  background:var(--slot);
  box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--slot-hi);
  position:relative;
}

/* ============ ВЕРСТАК ============ */
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.topbar .mbtn{font-size:14px;min-height:38px;}
.crafthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.crafthead small{font-size:13px;color:#5a5a5a;}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px;}
.col{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;padding:8px 4px 10px;border:0;font:inherit;color:inherit;}
.col .ico{width:100%;max-width:76px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.col .ico svg{width:78%;height:78%;}
.col .nm{margin-top:8px;font-size:14px;line-height:1.15;color:#fff;text-shadow:1px 1px 0 #333;min-height:2.3em;display:flex;align-items:center;}
.col .tn{font-size:12px;color:#dedede;text-shadow:1px 1px 0 #333;margin-top:2px;}
.col .mini{width:86%;height:7px;background:#1c1c1c;margin-top:8px;border:1px solid #000;}
.col .mini i{display:block;height:100%;background:var(--xp);width:0;}
.col .pc{font-size:13px;color:var(--xp);text-shadow:1px 1px 0 #1f3f05;margin-top:4px;}
.col.live:hover,.col.live:focus-visible{outline:3px solid #fff;outline-offset:-3px;}
.col.live .ico{animation:itemfloat 2.4s ease-in-out infinite;}
@keyframes itemfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.col.locked{cursor:not-allowed;}
.col.locked .ico svg{filter:grayscale(1) brightness(.55);opacity:.45;}
.col.locked .nm,.col.locked .tn{color:#9e9e9e;text-shadow:none;}
.col .lock{position:absolute;right:4px;top:4px;width:20px;height:20px;}
.col .soon{font-size:11px;color:#5c5c5c;margin-top:8px;letter-spacing:.08em;}
.arrow{display:flex;justify-content:center;margin:12px 0 6px;}
.arrow svg{width:64px;height:40px;}
.result{display:flex;align-items:center;justify-content:center;gap:14px;}
.result .big{width:104px;height:104px;display:flex;align-items:center;justify-content:center;}
.result .big svg{width:72%;height:72%;filter:grayscale(1) brightness(.55);opacity:.45;}
.result .lab{max-width:280px;}
.result .lab b{display:block;font-weight:normal;font-size:20px;color:#5a5a5a;}
.result .lab span{font-size:13px;color:#6b6b6b;font-family:var(--sans);}

/* статистика игрока */
.player{display:flex;gap:14px;align-items:center;}
.player .rk{width:64px;height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;}
.player .rk svg{width:80%;height:80%;}
.player .info{flex:1;min-width:0;}
.player .rname{font-size:20px;color:var(--txt);}
.player .rnext{font-size:13px;color:#5f5f5f;margin-top:2px;font-family:var(--sans);}
.xpwrap{position:relative;margin-top:16px;}
.xplvl{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-size:20px;color:var(--xp);
  text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000;z-index:2;line-height:1;}
.xpbar{height:14px;background:#141414;border:2px solid #000;position:relative;overflow:hidden;}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(#b8ff6a 0 35%,var(--xp) 35% 70%,#4fae12 70%);transition:width .5s cubic-bezier(.2,.8,.2,1);}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5.55% - 2px),#000 calc(5.55% - 2px) 5.55%);opacity:.55;}
.xpbar.aqua i{background:linear-gradient(#a6f0ff 0 35%,var(--aqua) 35% 70%,#1a8fb3 70%);}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px;}
.stats span{background:#a8a8a8;color:#2e2e2e;padding:3px 8px;box-shadow:inset 1px 1px 0 #6d6d6d,inset -1px -1px 0 #e0e0e0;}

/* ============ ОРФОГРАФИЯ: СПИСОК БЛОКОВ ============ */
.parthead{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;font-size:16px;color:var(--txt);}
.parthead em{font-style:normal;color:#2f6e0b;}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.blk{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px 8px 8px;border:0;font:inherit;color:#fff;cursor:pointer;min-height:76px;}
.blk:hover,.blk:focus-visible{outline:3px solid #fff;outline-offset:-3px;}
.blk .bi{flex:0 0 56px;width:56px;height:56px;}
.blk .bi svg{width:100%;height:100%;}
.blk .bt{flex:1;min-width:0;}
.blk .bn{font-family:var(--sans);font-size:14px;line-height:1.25;color:#fff;text-shadow:1px 1px 0 #3a3a3a;font-weight:600;}
.blk .bm{font-size:12px;color:#e8e8e8;text-shadow:1px 1px 0 #333;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.blk .tag{background:#3f3f3f;color:#ffd84a;padding:1px 5px;font-size:11px;text-shadow:none;}
.blk .tag.ex{color:#5ff0ea;}
.blk .lb{height:6px;background:#1c1c1c;border:1px solid #000;margin-top:6px;}
.blk .lb i{display:block;height:100%;background:var(--xp);}
.blk .bp{font-size:15px;color:var(--xp);text-shadow:1px 1px 0 #1f3f05;flex:0 0 auto;}
.blk.done{background:#6f8f5f;}
.legend{font-family:var(--sans);font-size:13px;color:#4a4a4a;line-height:1.4;margin-top:4px;}

/* ============ HUD ============ */
.hud{position:sticky;top:0;z-index:20;margin:-12px -12px 10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:rgba(20,18,16,.92);border-bottom:2px solid #000;}
.hud-r1{display:flex;align-items:center;gap:8px;}
.hud-title{flex:1;min-width:0;font-family:var(--sans);font-weight:600;font-size:14px;line-height:1.2;color:#fff;}
.hud-x{font-size:14px;color:#ffd84a;white-space:nowrap;}
.hud-r2{display:flex;align-items:center;gap:8px;margin-top:7px;}
.hud-r2 .lab{width:56px;font-size:12px;color:#cfcfcf;}
.hud-r2 .xpbar{flex:1;height:12px;}
.hud-r2 .val{width:42px;text-align:right;font-size:13px;color:var(--xp);}
.hud-r2.g .val{color:var(--aqua);}

/* ============ ТЕОРИЯ: КНИГА ============ */
.book{background:var(--page);color:var(--page-ink);border:2px solid #000;border-radius:4px;
  box-shadow:inset 0 0 0 4px #e3d3a6,inset 0 0 0 6px #b9a26a,4px 4px 0 rgba(0,0,0,.35);
  padding:22px 20px 18px;margin:10px 0;font-family:var(--sans);font-size:16px;line-height:1.55;}
.book h3{font-family:var(--pix);font-weight:normal;font-size:22px;margin:0 0 12px;color:#5b3a12;letter-spacing:.02em;}
.book .ex{color:#1f7a14;font-weight:700;}
.book .bad{color:#b3261e;}
.book .tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;}
.book .tbl td,.book .tbl th{border:1px solid #b9a26a;padding:6px 8px;text-align:left;vertical-align:top;}
.book .tbl th{background:#e6d6a8;}
.book .pgno{font-family:var(--pix);text-align:right;font-size:13px;color:#8a7442;margin-top:12px;}
.tnav{display:flex;gap:8px;align-items:center;}
.tnav .mbtn{flex:1;}
.note{font-family:var(--sans);font-size:14px;color:#e9e9e9;background:rgba(0,0,0,.45);padding:8px 10px;margin-top:10px;border-left:4px solid #ffd84a;}

/* ============ ВОПРОС ============ */
.qcard{background:rgba(16,0,16,.9);border:2px solid #000;box-shadow:inset 0 0 0 2px #2a0a5e,inset 0 0 0 4px #1a0640;
  padding:16px 16px 18px;margin:10px 0 12px;}
.qtype{font-size:13px;color:#a9a9ff;letter-spacing:.06em;}
.qtype .st{color:#ffd84a;}
.qtext{margin-top:10px;font-family:var(--sans);font-weight:700;font-size:clamp(24px,5vw,32px);line-height:1.3;color:#fff;letter-spacing:.01em;}
.qtext.long{font-size:clamp(17px,3.4vw,21px);font-weight:600;line-height:1.4;}
.qtext .gap{color:#ffd84a;}
.opts{display:grid;gap:8px;}
.opt{justify-content:flex-start;text-align:left;width:100%;min-height:54px;font-family:var(--sans);font-weight:700;font-size:22px;padding:10px 14px;text-shadow:1px 1px 0 #3e3e3e;}
.opt.sans{font-weight:600;font-size:17px;}
.opt .k{font-family:var(--pix);font-weight:normal;}
.opt .k{display:inline-block;min-width:1.6em;color:#ffffa0;}
.opt.sel{background:linear-gradient(#8ea0cf,#6c7fb3);box-shadow:inset 2px 2px 0 #c3ceff,inset -2px -3px 0 #3d4a7a;}
.opt.ok,.opt.ok:disabled{background:linear-gradient(#5fae3c,#3f8526);box-shadow:inset 2px 2px 0 #9be07a,inset -2px -3px 0 #275717;color:#fff;text-shadow:2px 2px 0 #1f4a10;}
.opt.bad,.opt.bad:disabled{background:linear-gradient(#c24a3a,#962f22);box-shadow:inset 2px 2px 0 #f08c7c,inset -2px -3px 0 #5a160e;color:#fff;text-shadow:2px 2px 0 #4a1008;}
.fb{margin-top:12px;background:var(--page);color:var(--page-ink);border:2px solid #000;padding:12px 14px;font-family:var(--sans);font-size:16px;line-height:1.5;border-left:8px solid #3f8526;}
.fb.bad{border-left-color:#b3261e;}
.fb .vd{display:block;font-family:var(--pix);font-size:18px;margin-bottom:4px;color:#2f6e0b;}
.fb.bad .vd{color:#b3261e;}
.hint{font-family:var(--sans);font-size:14px;color:#c9c9ff;margin-top:8px;}

/* ============ ЧАТ ============ */
#chat{position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;
  display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(560px,calc(100vw - 20px));}
#chat .ln{background:rgba(0,0,0,.55);padding:4px 8px;font-size:15px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;transition:opacity .5s;}
#chat .g{color:var(--green);} #chat .r{color:var(--red);} #chat .y{color:#ffff55;} #chat .a{color:var(--aqua);}

/* ============ ТОСТ ДОСТИЖЕНИЯ ============ */
#toast{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));z-index:60;
  display:flex;gap:10px;align-items:center;background:#212121;border:2px solid #000;box-shadow:inset 0 0 0 2px #555;
  padding:10px 14px 10px 10px;transform:translateY(-150%);transition:transform .45s cubic-bezier(.2,.9,.2,1);max-width:calc(100vw - 20px);}
#toast.on{transform:translateY(0);}
#toast .ti{width:40px;height:40px;flex:0 0 40px;}
#toast .t1{font-size:14px;color:#ffff55;}
#toast .t2{font-size:16px;color:#fff;margin-top:2px;}

/* частицы опыта */
.orb{position:fixed;z-index:50;width:10px;height:10px;background:#c8ff4a;box-shadow:0 0 6px 2px rgba(180,255,60,.8);pointer-events:none;
  transition:transform .8s cubic-bezier(.3,.6,.4,1),opacity .8s;}

/* ============ ИТОГ ============ */
.res{text-align:center;}
.res .big{font-size:clamp(28px,7vw,44px);color:#ffff55;text-shadow:3px 3px 0 #3f3f00;margin:6px 0;}
.res .big.lose{color:#ff8a55;text-shadow:3px 3px 0 #4a1e00;}
.res .item{width:96px;height:96px;margin:6px auto;animation:pop .6s cubic-bezier(.2,1.6,.4,1);}
.res .item svg{width:100%;height:100%;}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.res .grade{font-size:18px;color:var(--aqua);margin-top:6px;}
.res .score{font-family:var(--sans);font-size:16px;line-height:1.7;margin-top:10px;color:var(--txt);}

.foot{text-align:center;font-size:12px;color:#bdbdbd;margin-top:16px;text-shadow:1px 1px 0 #000;}

/* ============ УЗКИЕ ЭКРАНЫ ============ */
@media (max-width:700px){
  .grid7{grid-template-columns:repeat(4,minmax(0,1fr));}
  .blocks{grid-template-columns:1fr;}
}
@media (max-width:600px),(orientation:portrait){
  .splash{top:calc(5vh + clamp(40px,10vw,118px) + 46px);right:6%;}
}
@media (max-width:420px){
  .col .nm{font-size:12px;} .col .tn{font-size:11px;}
  .panel{padding:10px;}
  .opt{font-size:18px;}
  #chat .ln{font-size:13px;}
  #chat{bottom:calc(64px + env(safe-area-inset-bottom));}
}
@media (orientation:portrait){
  #scene{transform-origin:50% 70%;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>

<!-- ============ ЗАСТАВКА ============ -->
<div id="title">
  <div id="scene">
    <div id="fallback">
      <div class="sky"></div><div class="sun"></div>
      <div class="cloud" style="top:12%;width:16vmin;animation-delay:-10s"></div>
      <div class="cloud" style="top:22%;width:22vmin;animation-delay:-35s;animation-duration:80s"></div>
      <div class="hill" style="left:-4%"></div><div class="hill" style="left:62%;width:42%;height:26%"></div>
      <div class="grass"></div>
      <div class="fbench" id="fbench"></div>
    </div>
    <img id="posterImg" class="layer" alt="" src="poster.jpg">
    <video id="vid" muted loop playsinline autoplay preload="auto" poster="poster.jpg" class="hidden">
      <source src="zastavka.mp4" type="video/mp4">
    </video>
    <img id="benchLayer" class="hidden" alt="" src="verstak.png">
  </div>
  <div id="benchGlow" class="hidden"></div>

function svgFrom(map,pal,extra){
  var h=map.length,w=map[0].length,s='';
  for(var y=0;y<h;y++){
    var row=map[y],x=0;
    while(x<w){
      var ch=row.charAt(x);
      if(ch==='.'||!pal[ch]){x++;continue;}
      var x2=x;while(x2+1<w&&row.charAt(x2+1)===ch)x2++;
      s+='<rect x="'+x+'" y="'+y+'" width="'+(x2-x+1)+'" height="1" fill="'+pal[ch]+'"/>';
      x=x2+1;
    }
  }
  return '<svg class="px" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+s+(extra||'')+'</svg>';
}

    if(d&&d.solved){SECTIONS.forEach(function(s){var o=d.solved[s.id];if(o){for(var k in o){if(+k<s.q.length)state.solved[s.id][k]=1;}}});}
    if(d&&d.seen)state.seen=d.seen;

function save(){try{var g=totals();localStorage.setItem(STORE,JSON.stringify({solved:state.solved,seen:state.seen,sound:state.sound,rank:state.rank,pct:g.p,done:g.d,total:g.t}));}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function secTotal(s){return s.q.length;}
function secSolved(s){return Object.keys(state.solved[s.id]).length;}
function secPct(s){return Math.round(secSolved(s)/secTotal(s)*100);}
function totals(){var t=0,d=0;SECTIONS.forEach(function(s){t+=secTotal(s);d+=secSolved(s);});return{t:t,d:d,p:Math.round(d/t*100)};}
function rankIdx(d){var r=0;for(var i=0;i<RANKS.length;i++){if(d>=RANKS[i].at)r=i;}return r;}
function stripTags(s){return String(s).replace(/<[^>]*>/g,'');}

var AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
document.addEventListener('touchstart',function(){ac();},{passive:true});
document.addEventListener('mousedown',function(){ac();});
function tone(f1,f2,dur,type,vol,delay){
  if(!state.sound)return;var c=ac();if(!c)return;
  var t0=c.currentTime+(delay||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.06,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.02);
}
function noise(dur,freq,vol,delay,type){
  if(!state.sound)return;var c=ac();if(!c)return;
  var t0=c.currentTime+(delay||0);
  var len=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);}
  var src=c.createBufferSource();src.buffer=buf;
  var f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1200;
  var g=c.createGain();g.gain.value=vol||0.15;
  src.connect(f);f.connect(g);g.connect(c.destination);src.start(t0);
}

/* =========================================================
   ЗВУКИ ПРИРОДЫ НА ЗАСТАВКЕ (ветер, листва, птицы, пчёлы)
   ========================================================= */
var AMB={on:false,master:null,srcs:[],timers:[]};
function noiseBuf(c,sec,brown){
  var len=Math.floor(c.sampleRate*sec),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;if(brown){last=(last+0.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}
  return b;
}
function pan(c,v){if(c.createStereoPanner){var p=c.createStereoPanner();p.pan.value=v;return p;}return c.createGain();}
function ambStart(){
  if(AMB.on||!state.sound)return;var c=ac();if(!c)return;AMB.on=true;
  var now=c.currentTime,m=c.createGain();m.gain.setValueAtTime(0.0001,now);m.gain.exponentialRampToValueAtTime(1,now+2.5);m.connect(c.destination);AMB.master=m;
  /* ветер */
  var w=c.createBufferSource();w.buffer=noiseBuf(c,6,true);w.loop=true;
  var wf=c.createBiquadFilter();wf.type='lowpass';wf.frequency.value=480;
  var wg=c.createGain();wg.gain.value=0.16;
  var l1=c.createOscillator(),l1g=c.createGain();l1.frequency.value=0.07;l1g.gain.value=0.09;l1.connect(l1g);l1g.connect(wg.gain);
  var l2=c.createOscillator(),l2g=c.createGain();l2.frequency.value=0.045;l2g.gain.value=260;l2.connect(l2g);l2g.connect(wf.frequency);
  w.connect(wf);wf.connect(wg);wg.connect(m);w.start();l1.start();l2.start();
  /* шелест листвы и травы */
  var lv=c.createBufferSource();lv.buffer=noiseBuf(c,4,false);lv.loop=true;
  var lf=c.createBiquadFilter();lf.type='bandpass';lf.frequency.value=5200;lf.Q.value=0.7;
  var lgn=c.createGain();lgn.gain.value=0.004;
  lv.connect(lf);lf.connect(lgn);lgn.connect(m);lv.start();
  AMB.srcs=[w,l1,l2,lv];
  function gust(){if(!AMB.on)return;var t=c.currentTime,d=1.2+Math.random()*2;
    lgn.gain.cancelScheduledValues(t);lgn.gain.setValueAtTime(lgn.gain.value,t);
    lgn.gain.linearRampToValueAtTime(0.02+Math.random()*0.02,t+d*0.4);lgn.gain.linearRampToValueAtTime(0.004,t+d);
    AMB.timers.push(setTimeout(gust,2500+Math.random()*5000));}
  function bird(){if(!AMB.on)return;birdSong(c,m);AMB.timers.push(setTimeout(bird,900+Math.random()*3200));}
  function bee(){if(!AMB.on)return;beeBuzz(c,m);AMB.timers.push(setTimeout(bee,7000+Math.random()*9000));}
  AMB.timers.push(setTimeout(gust,1500),setTimeout(bird,700),setTimeout(bee,4000));
}
function chirpNote(c,out,t,f1,f2,dur,vol){
  var o=c.createOscillator(),g=c.createGain();o.type='sine';
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*0.25);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.02);
}
function birdSong(c,m){
  var p=pan(c,Math.random()*1.6-0.8),g=c.createGain();g.gain.value=0.5+Math.random()*0.5;p.connect(g);g.connect(m);
  var t=c.currentTime+0.02,kind=Math.floor(Math.random()*4),v=0.035,i;
  if(kind===0){for(i=0;i<3+Math.floor(Math.random()*3);i++)chirpNote(c,p,t+i*0.11,3000+Math.random()*400,4200,0.07,v);}
  else if(kind===1){chirpNote(c,p,t,2300,3300,0.18,v);chirpNote(c,p,t+0.2,3300,2500,0.22,v);}
  else if(kind===2){for(i=0;i<9;i++)chirpNote(c,p,t+i*0.045,4600-i*60,3900-i*60,0.035,v*0.8);}
  else{chirpNote(c,p,t,2800,2600,0.12,v);chirpNote(c,p,t+0.16,3600,3400,0.1,v);chirpNote(c,p,t+0.3,2800,2500,0.16,v);}
  setTimeout(function(){try{p.disconnect();g.disconnect();}catch(e){}},2500);
}
function beeBuzz(c,m){
  var t=c.currentTime,d=2+Math.random()*1.5,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),tr=c.createOscillator(),tg=c.createGain(),p=pan(c,-0.9);
  o.type='sawtooth';o.frequency.setValueAtTime(205,t);o.frequency.linearRampToValueAtTime(225,t+d*0.5);o.frequency.linearRampToValueAtTime(200,t+d);
  f.type='lowpass';f.frequency.value=800;
  tr.frequency.value=9;tg.gain.value=0.004;tr.connect(tg);tg.connect(g.gain);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.008,t+d*0.3);g.gain.linearRampToValueAtTime(0.0001,t+d);
  if(p.pan){p.pan.setValueAtTime(-0.9,t);p.pan.linearRampToValueAtTime(0.9,t+d);}
  o.connect(f);f.connect(g);g.connect(p);p.connect(m);o.start(t);tr.start(t);o.stop(t+d+0.05);tr.stop(t+d+0.05);
}
function ambStop(fade){
  if(!AMB.on)return;AMB.on=false;
  AMB.timers.forEach(clearTimeout);AMB.timers=[];
  var c=ac(),m=AMB.master,s=AMB.srcs;AMB.master=null;AMB.srcs=[];
  if(!c||!m)return;var t=c.currentTime,f=fade||0.8;
  m.gain.cancelScheduledValues(t);m.gain.setValueAtTime(Math.max(m.gain.value,0.0002),t);m.gain.exponentialRampToValueAtTime(0.0001,t+f);
  setTimeout(function(){s.forEach(function(x){try{x.stop();}catch(e){}});try{m.disconnect();}catch(e){}},f*1000+100);
}

/* пересчёт: где верстак на экране при обрезке кадра по размеру экрана */
function layoutBench(){
  var W=titleEl.clientWidth,H=titleEl.clientHeight;
  var b=BENCH;
  if(!hasPoster&&!hasVideo){
    var fb=document.getElementById('fbench').getBoundingClientRect();
    place(fb.left,fb.top,fb.width,fb.height);return;
  }
  var s=Math.max(W/FRAME.w,H/FRAME.h),dw=FRAME.w*s,dh=FRAME.h*s,ox=(W-dw)/2,oy=(H-dh)/2;
  var x=ox+b.x0*dw,y=oy+b.y0*dh,w=(b.x1-b.x0)*dw,h=(b.y1-b.y0)*dh;
  place(x,y,w,h);
  benchLayer.style.left=x+'px';benchLayer.style.top=y+'px';benchLayer.style.width=w+'px';benchLayer.style.height=h+'px';
}
function place(x,y,w,h){
  var pad=Math.max(12,w*0.12);
  hit.style.left=(x-pad)+'px';hit.style.top=(y-pad)+'px';hit.style.width=(w+pad*2)+'px';hit.style.height=(h+pad*2)+'px';
  glow.style.left=x+'px';glow.style.top=y+'px';glow.style.width=w+'px';glow.style.height=h+'px';
  hint.style.left=(x+w/2)+'px';hint.style.top=(y-10)+'px';
  scene.style.transformOrigin=(x+w/2)+'px '+(y+h*0.55)+'px';
  BENCH_SCREEN={x:x,y:y,w:w,h:h};
}

function chips(){
  var b=BENCH_SCREEN,cols=['#c48a4a','#94612f','#5e3c1a','#9a6a36','#d9d9d9'];
  for(var i=0;i<26;i++){
    (function(){
      var c=document.createElement('div');c.className='chip';
      c.style.background=cols[Math.floor(Math.random()*cols.length)];
      var x=b.x+b.w*Math.random(),y=b.y+b.h*(0.2+Math.random()*0.6);
      c.style.left=x+'px';c.style.top=y+'px';
      var sz=6+Math.random()*8;c.style.width=sz+'px';c.style.height=sz+'px';
      titleEl.appendChild(c);
      var vx=(Math.random()-0.5)*14,vy=-6-Math.random()*8,t=0;
      (function step(){
        t++;x+=vx;y+=vy;vy+=0.7;c.style.left=x+'px';c.style.top=y+'px';c.style.opacity=String(Math.max(0,1-t/42));
        if(t<42)requestAnimationFrame(step);else if(c.parentNode)c.parentNode.removeChild(c);
      })();
    })();

}

  tryVideo();ambStart();
};
document.addEventListener('keydown',function(e){if(!titleEl.classList.contains('hidden')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();var ov=document.getElementById('startOv');if(!ov.classList.contains('gone'))document.getElementById('playBtn').click();else openBench();}});
function backToTitle(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('bg').classList.add('hidden');
  titleEl.classList.remove('hidden');
  scene.style.transform='';scene.style.filter='';benchLayer.style.transform='';
  document.getElementById('flash').style.opacity='0';
  hint.classList.remove('hidden');
  if(hasBench)benchLayer.classList.add('breath');
  opening=false;tryVideo();ambStart();setTimeout(layoutBench,30);
}

/* фон меню: размытая заставка + своя пиксельная «земля» */
(function(){
  try{
    var c=document.createElement('canvas');c.width=16;c.height=16;var x=c.getContext('2d');
    var cols=['#5a3d26','#6b4a30','#4a3220','#7a5638','#3e2a1a'];
    for(var i=0;i<16;i++)for(var j=0;j<16;j++){x.fillStyle=cols[Math.floor(Math.random()*cols.length)];x.fillRect(i,j,1,1);}
    document.getElementById('dirt').style.backgroundImage='url('+c.toDataURL()+')';
  }catch(e){}
  document.getElementById('bgph').style.backgroundImage='url(poster.jpg)';
  try{document.getElementById('favicon').href='data:image/svg+xml,'+encodeURIComponent(pickIcon(RANKS[4]));}catch(e){}
})();

/* =========================================================
   ЭКРАН ВЕРСТАКА
   ========================================================= */
var w=document.getElementById('w');
function xpLevel(d){return Math.floor(d/10);}
function playerPanel(){
  var g=totals(),r=rankIdx(g.d),nx=RANKS[r+1];
  var next=nx?('До звания «'+nx.n+'»: ещё '+(nx.at-g.d)+' верных ответов'):'Высшее звание! Все вопросы решены.';
  return '<div class="panel"><div class="player">'+
    '<div class="rk slot">'+pickIcon(RANKS[r])+'</div>'+
    '<div class="info"><div class="rname">Звание: '+RANKS[r].n+'</div><div class="rnext">'+next+'</div></div></div>'+
    '<div class="xpwrap"><div class="xplvl">'+xpLevel(g.d)+'</div><div class="xpbar"><i style="width:'+g.p+'%"></i></div></div>'+
    '<div class="stats"><span>решено '+g.d+' из '+g.t+'</span><span>всего '+g.p+'%</span>'+
    '<span>блоков добыто '+SECTIONS.filter(function(s){return secPct(s)===100;}).length+' / '+SECTIONS.length+'</span></div></div>';
}
function renderCraft(){
  var g=totals();
  var h='<div class="topbar"><button class="mbtn" id="toTitle">◀ НА ПОЛЯНУ</button><button class="mbtn" id="snd">'+soundLabel()+'</button></div>';
  h+='<div class="panel"><div class="crafthead"><h2>Верстак</h2><small>Собери все 7 разделов — получишь пробный ОГЭ</small></div><div class="grid7">';
  COLUMNS.forEach(function(c,i){
    if(c.live){
      h+='<button class="col slot live" data-c="'+i+'"><div class="ico">'+icon(c.icon)+'</div>'+
         '<div class="nm">'+c.name+'</div><div class="tn">'+c.tasks+'</div>'+
         '<div class="mini"><i style="width:'+g.p+'%"></i></div><div class="pc">'+g.p+'%</div></button>';
    }else{
      h+='<button class="col slot locked" data-c="'+i+'" aria-disabled="true"><span class="lock">'+icon('lock')+'</span><div class="ico">'+icon(c.icon)+'</div>'+
         '<div class="nm">'+c.name+'</div><div class="tn">'+c.tasks+'</div><div class="soon">СКОРО</div></button>';
    }
  });
  h+='</div><div class="arrow">'+icon('arrow')+'</div>';
  h+='<div class="result"><div class="big slot">'+icon('gem')+'<span class="lock" style="position:absolute;right:6px;top:6px;width:22px;height:22px">'+icon('lock')+'</span></div>'+
     '<div class="lab"><b>Пробный ОГЭ</b><span>Откроется, когда будут собраны все разделы.</span></div></div></div>';
  h+=playerPanel();
  h+='<div class="foot">ОГЭКРАФТ · ТРЕНАЖЁР ПО РУССКОМУ ЯЗЫКУ</div>';
  w.innerHTML=h;
  document.getElementById('toTitle').onclick=backToTitle;
  document.getElementById('snd').onclick=function(){state.sound=!state.sound;save();this.textContent=soundLabel();tSound.textContent=soundLabel();if(state.sound){ac();SFX.click();}};
  Array.prototype.forEach.call(w.querySelectorAll('.col'),function(el){
    el.onclick=function(){
      var c=COLUMNS[+el.dataset.c];
      if(!c.live){SFX.locked();chat('<span class="r">Раздел «'+c.name+'» пока закрыт.</span> Откроется после уроков.');return;}
      SFX.stone(0);SFX.stone(1);renderOrfo();
    };
  });
  window.scrollTo(0,0);
}

/* =========================================================
   ЭКРАН ОРФОГРАФИИ
   ========================================================= */
function renderOrfo(){
  var g=totals();
  var h='<div class="topbar"><button class="mbtn" id="toCraft">◀ ВЕРСТАК</button><button class="mbtn" id="snd">'+soundLabel()+'</button></div>';
  h+='<div class="panel"><div class="crafthead"><h2>Орфография · задания 6–7</h2><small>'+SECTIONS.length+' блоков · '+g.t+' вопросов</small></div>'+
     '<div class="legend">Каждый блок — руда в камне. Решай вопросы: камень трескается, а когда блок пройден на 100%, ты получаешь самоцвет.</div>'+
     '<div class="xpwrap"><div class="xplvl">'+xpLevel(g.d)+'</div><div class="xpbar"><i style="width:'+g.p+'%"></i></div></div></div>';
  var parts=[];
  SECTIONS.forEach(function(s,i){if(parts.indexOf(s.part)<0)parts.push(s.part);});
  parts.forEach(function(p){
    var list=SECTIONS.filter(function(s){return s.part===p;});
    var pt=0,pd=0;list.forEach(function(s){pt+=secTotal(s);pd+=secSolved(s);});
    var ore=ORE[p]||ORE['ФИНАЛ'];
    h+='<div class="panel"><div class="parthead"><span>'+p.charAt(0)+p.slice(1).toLowerCase()+' · '+ore.n+'</span><em>'+Math.round(pd/pt*100)+'%</em></div><div class="blocks">';
    list.forEach(function(s){
      var i=SECTIONS.indexOf(s),pc=secPct(s);
      var tag=s.kind==='ЭКЗАМЕН'?'<span class="tag ex">ЭКЗАМЕН</span>':(s.kind==='ТЕОРИЯ'?'<span class="tag">ТЕОРИЯ</span>':'');
      h+='<button class="blk slot'+(pc===100?' done':'')+'" data-i="'+i+'">'+
         '<div class="bi">'+(pc===100?gemIcon(ore):oreIcon(ore,pc))+'</div>'+
         '<div class="bt"><div class="bn">'+s.name+'</div>'+
         '<div class="bm">'+tag+'<span>'+secSolved(s)+' / '+secTotal(s)+'</span></div>'+
         '<div class="lb"><i style="width:'+pc+'%"></i></div></div>'+
         '<div class="bp">'+pc+'%</div></button>';
    });
    h+='</div></div>';
  });
  h+='<button class="mbtn wide" id="reset">СБРОСИТЬ ПРОГРЕСС</button>';
  h+='<div class="foot">Ошибка не наказывается: вопрос вернётся в конец очереди.</div>';
  w.innerHTML=h;
  document.getElementById('toCraft').onclick=function(){renderCraft();};
  document.getElementById('snd').onclick=function(){state.sound=!state.sound;save();this.textContent=soundLabel();tSound.textContent=soundLabel();if(state.sound){ac();SFX.click();}};
  var rs=document.getElementById('reset'),armed=false,armT=null;
  rs.onclick=function(){
    if(!armed){armed=true;rs.textContent='ТОЧНО СБРОСИТЬ? НАЖМИ ЕЩЁ РАЗ';rs.style.background='linear-gradient(#c24a3a,#962f22)';
      armT=setTimeout(function(){armed=false;rs.textContent='СБРОСИТЬ ПРОГРЕСС';rs.style.background='';},3500);return;}
    clearTimeout(armT);
    SECTIONS.forEach(function(s){state.solved[s.id]={};});state.seen={};state.rank=0;save();SFX.thud();renderOrfo();
  };
  Array.prototype.forEach.call(w.querySelectorAll('.blk'),function(el){
    el.onclick=function(){SFX.stone(0);SFX.stone(1);openSection(+el.dataset.i);};
  });
  window.scrollTo(0,0);
}

/* =========================================================
   ТЕОРИЯ
   ========================================================= */
var tIdx=0,curSec=null;
function openSection(i){curSec=SECTIONS[i];tIdx=0;if(curSec.theory&&curSec.theory.length)renderTheory();else startDrill();}
function hudHTML(extra){
  var g=totals(),loc=secPct(curSec);
  return '<div class="hud"><div class="hud-r1"><button class="mbtn small" id="back">◀ БЛОКИ</button>'+
    '<div class="hud-title">'+curSec.name+'</div><div class="hud-x">'+(extra||'')+'</div></div>'+
    '<div class="hud-r2"><span class="lab">БЛОК</span><div class="xpbar"><i style="width:'+loc+'%"></i></div><span class="val">'+loc+'%</span></div>'+
    '<div class="hud-r2 g"><span class="lab">ВСЕГО</span><div class="xpbar aqua"><i style="width:'+g.p+'%"></i></div><span class="val">'+g.p+'%</span></div></div>';
}
function bindBack(){document.getElementById('back').onclick=function(){renderOrfo();};}
function renderTheory(){
  var t=curSec.theory[tIdx],n=curSec.theory.length;
  var h=hudHTML('ТЕОРИЯ');
  h+='<div class="book"><h3>'+t.h+'</h3>'+t.b+'<div class="pgno">Страница '+(tIdx+1)+' из '+n+'</div></div>';
  h+='<div class="tnav"><button class="mbtn" id="tprev"'+(tIdx===0?' disabled':'')+'>◀ НАЗАД</button>'+
     (tIdx<n-1?'<button class="mbtn" id="tnext">ДАЛЕЕ ▶</button>':'<button class="mbtn green" id="tgo">КОПАТЬ! ⛏</button>')+'</div>';
  if(tIdx<n-1&&state.seen[curSec.id])h+='<button class="mbtn wide" id="skip">ПРОПУСТИТЬ ТЕОРИЮ</button>';
  if(!state.seen[curSec.id]&&tIdx===0)h+='<div class="note">Сначала теория: пролистай книгу до конца — потом откроются задания.</div>';
  w.innerHTML=h;bindBack();
  var pv=document.getElementById('tprev');if(pv)pv.onclick=function(){if(tIdx>0){tIdx--;SFX.page();renderTheory();}};
  var nx=document.getElementById('tnext');if(nx)nx.onclick=function(){tIdx++;SFX.page();renderTheory();};
  var go=document.getElementById('tgo');if(go)go.onclick=function(){SFX.dig(0);startDrill();};
  var sk=document.getElementById('skip');if(sk)sk.onclick=function(){SFX.dig(0);startDrill();};
  window.scrollTo(0,0);
}

/* =========================================================
   ПРАКТИКА
   ========================================================= */
var queue=[],qi=0,answered=false,picked=[],streak=0,stats={hit:0,miss:0},missed={};
function startDrill(){
  queue=[];for(var i=0;i<curSec.q.length;i++)queue.push(i);shuffle(queue);
  if(!state.seen[curSec.id]){state.seen[curSec.id]=1;save();}
  qi=0;streak=0;stats={hit:0,miss:0};missed={};renderQ();
}
function renderQ(){
  if(qi>=queue.length){renderResult();return;}
  answered=false;picked=[];
  var idx=queue[qi],q=curSec.q[idx],left=queue.length-qi;
  var label=q.ty==='multi'?'ВЫБЕРИ ВСЕ ВЕРНЫЕ ВАРИАНТЫ':(q.ty==='odd'?'НАЙДИ ЛИШНЕЕ':'ВЫБЕРИ ОДИН ВАРИАНТ');
  var plain=stripTags(q.t);
  var isLong=plain.length>46;
  var h=hudHTML('ОСТАЛОСЬ '+left);
  h+='<div class="qcard"><div class="qtype">'+label+(streak>1?' · <span class="st">СЕРИЯ ×'+streak+'</span>':'')+'</div>'+
     '<div class="qtext'+(isLong?' long':'')+'">'+q.t.replace(/__/g,'<span class="gap">__</span>')+'</div>';
  if(q.ty==='multi')h+='<div class="hint">Отметь все нужные варианты и нажми «Проверить».</div>';
  h+='</div><div class="opts" id="opts">';
  var longOpts=q.o.some(function(x){return stripTags(x).length>18;});
  shuffle(q.o.map(function(x,i){return i;})).forEach(function(i,pos){
    h+='<button class="mbtn opt'+(longOpts?' sans':'')+'" data-o="'+i+'"><span class="k">'+(pos+1)+'</span>'+q.o[i]+'</button>';
  });
  h+='</div>';
  if(q.ty==='multi')h+='<button class="mbtn green wide" id="fire">ПРОВЕРИТЬ</button>';
  h+='<div id="after"></div>';
  w.innerHTML=h;bindBack();
  Array.prototype.forEach.call(w.querySelectorAll('#opts .opt'),function(b){b.onclick=function(){onPick(+b.dataset.o,b);};});
  var f=document.getElementById('fire');if(f)f.onclick=checkMulti;
  window.scrollTo(0,0);
}
function onPick(i,btn){
  if(answered)return;
  var q=curSec.q[queue[qi]];
  if(q.ty==='multi'){
    SFX.click();
    var p=picked.indexOf(i);
    if(p>=0){picked.splice(p,1);btn.classList.remove('sel');}else{picked.push(i);btn.classList.add('sel');}
    return;
  }
  picked=[i];grade(i===q.a,btn);
}
function checkMulti(){
  if(answered)return;
  var q=curSec.q[queue[qi]];
  if(!picked.length){SFX.locked();return;}
  var a=q.a.slice().sort(function(x,y){return x-y;}).join(','),p=picked.slice().sort(function(x,y){return x-y;}).join(',');
  grade(a===p,document.getElementById('fire'));
}
function streakName(n){
  if(n>=10)return'АЛМАЗНАЯ СЕРИЯ!';if(n>=6)return'ШАХТЁР В УДАРЕ!';if(n>=4)return'КОМБО!';if(n>=2)return'ДВОЙНАЯ ДОБЫЧА';return'';
}
function grade(ok,fromBtn){
  answered=true;
  var idx=queue[qi],q=curSec.q[idx];
  var correct=q.ty==='multi'?q.a:[q.a];
  Array.prototype.forEach.call(w.querySelectorAll('#opts .opt'),function(b){
    var i=+b.dataset.o;b.disabled=true;b.classList.remove('sel');
    if(correct.indexOf(i)>=0)b.classList.add('ok');else if(picked.indexOf(i)>=0)b.classList.add('bad');
  });
  var fire=document.getElementById('fire');
  var word=q.ty==='multi'?'весь список':stripTags(q.o[correct[0]]);
  if(word.length>28)word=word.slice(0,27)+'…';
  if(ok){
    stats.hit++;streak++;
    if(!state.solved[curSec.id][idx]){state.solved[curSec.id][idx]=1;save();}
    var sn=streakName(streak);
    if(streak>=2)SFX.combo(streak);else SFX.pling();
    orbs(fromBtn||w.querySelector('#opts .opt.ok'));
    chat('<span class="g">+1 опыт</span> · «'+word+'»'+(sn?' <span class="y">'+sn+'</span>':''));
  }else{
    stats.miss++;streak=0;missed[idx]=1;
    SFX.miss();
    chat('<span class="r">Мимо!</span> Верно: «'+word+'» — вопрос вернётся позже');
    queue.push(idx);
  }
  if(fire)fire.remove();
  var fb='<div class="fb '+(ok?'':'bad')+'"><span class="vd">'+(ok?'ВЕРНО!':'НЕВЕРНО')+'</span>'+q.e+'</div>'+
         '<button class="mbtn wide" id="next">ДАЛЬШЕ ▶</button>';
  var after=document.getElementById('after');after.innerHTML=fb;
  document.getElementById('next').onclick=function(){qi++;renderQ();};
  var loc=secPct(curSec),g=totals(),bars=w.querySelectorAll('.hud-r2');
  bars[0].querySelector('i').style.width=loc+'%';bars[0].querySelector('.val').textContent=loc+'%';
  bars[1].querySelector('i').style.width=g.p+'%';bars[1].querySelector('.val').textContent=g.p+'%';
  if(ok)checkRank();
  try{after.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
}

/* =========================================================
   ИТОГ БЛОКА
   ========================================================= */
function renderResult(){
  var total=stats.hit+stats.miss,acc=total?Math.round(stats.hit/total*100):0,win=acc>=80;
  var ore=ORE[curSec.part]||ORE['ФИНАЛ'],pc=secPct(curSec);
  var grade=acc>=95?'Алмазная точность':acc>=85?'Золотая точность':acc>=70?'Железная точность':acc>=55?'Каменная точность':'Деревянная точность';
  if(pc===100){SFX.breakBlock();setTimeout(SFX.win,450);}else if(win)SFX.win();else SFX.fail();
  var g=totals();
  var mistakes=Object.keys(missed).map(function(k){return curSec.q[+k];});
  var h=hudHTML('ИТОГ');
  h+='<div class="panel res"><div class="big'+(win?'':' lose')+'">'+(pc===100?'БЛОК ДОБЫТ!':(win?'ОТЛИЧНО!':'ЕЩЁ РАЗОК!'))+'</div>'+
     '<div class="item">'+(pc===100?gemIcon(ore):oreIcon(ore,pc))+'</div>'+
     (pc===100?'<div style="color:#3a3a3a">Ты получил: '+ore.n+'</div>':'')+
     '<div class="grade" style="color:#14627a">'+grade+'</div>'+
     '<div class="score">Точность: <b>'+acc+'%</b><br>Верно: '+stats.hit+' · Ошибок: '+stats.miss+'<br>'+
     'Блок: <b>'+pc+'%</b> · Всего: <b>'+g.p+'%</b></div></div>';
  if(mistakes.length){
    h+='<div class="book"><h3>На чём споткнулся</h3>'+mistakes.slice(0,12).map(function(q){return '• '+q.t.replace(/__/g,'_')+' — '+q.e;}).join('<br>')+'</div>';
  }
  h+='<button class="mbtn green wide" id="again">ПРОЙТИ БЛОК СНОВА</button>';
  var i=SECTIONS.indexOf(curSec);
  if(i<SECTIONS.length-1)h+='<button class="mbtn wide" id="nextsec">СЛЕДУЮЩИЙ БЛОК ▶</button>';
  h+='<button class="mbtn wide" id="tomenu">К БЛОКАМ</button>';
  w.innerHTML=h;bindBack();
  document.getElementById('again').onclick=function(){SFX.dig(0);startDrill();};
  document.getElementById('tomenu').onclick=function(){renderOrfo();};
  var ns=document.getElementById('nextsec');if(ns)ns.onclick=function(){SFX.dig(0);openSection(i+1);};
  if(pc===100)chat('<span class="a">Блок «'+curSec.name+'» добыт!</span>');
  window.scrollTo(0,0);
}

document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');
  if(!b||b.classList.contains('col')||b.classList.contains('blk')||b.classList.contains('opt')||b.id==='benchHit'||b.id==='playBtn'||b.id==='fire'||b.id==='tSound'||b.id==='snd')return;
  SFX.click();
},true);
/* быстрый вход для проверки: адрес с #menu сразу открывает верстак */
if(location.hash==='#menu'){titleEl.classList.add('hidden');document.getElementById('bg').classList.remove('hidden');document.getElementById('app').classList.remove('hidden');renderCraft();}
</script>
